<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配置図</title>
<style>
/* ▼ tokens.css から。直すのは正本のほう（apps/haichi/scripts/parts.mjs の表） ▼ */
/* 配置図が使う色。中立の色・書体は assets/ui/base.css が正本。
   ここは homeroom-tools の shared/ui/tokens.css から、配置図が使う分（選択の青・警告）だけを写した。
   @dark{} は scripts/build.mjs が暗い配色の2ブロックへ展開する。 */
/* ▼ base.css から ▼ */
/* 中立の色・書体トークン — 全ツールが読む最小共通セット。
   評価ドメインの色（単元20色・A/B系・警告など）は tokens.css 側。
   @dark{} は build.py が暗い配色の2ブロックへ展開する。
   light 固定のツール（icon-maker）は build 側で @dark を除く。 */
:root{
  /* 書体。ウェブフォントは読まない。--font-ja は左から
     Mac（Hiragino）→ Windows（Yu Gothic / BIZ UD / Meiryo）→ Chromebook
     （Noto）の順に当たる。BIZ UD は Windows 10 以降の標準添付。
     --font-mono は数・記号の桁そろえ用。日本語が入る場面（診断行など）は
     後ろの BIZ UDゴシック／Noto Sans Mono CJK JP に落ちて読める。 */
  --font-ja:"Hiragino Sans","Yu Gothic UI","BIZ UDPGothic","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --font-mono:"Consolas","Menlo","Roboto Mono","BIZ UDGothic","Noto Sans Mono CJK JP",monospace;

  --paper:#FCFBF7; --sheet:#FFFFFF; --ink:#1D2126;
  --ink-soft:#5A6470; --ink-faint:#9AA3AD;
  --rule:#DFDCD2; --rule-soft:#EDEAE2; --accent:#2C5C9E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131619; --sheet:#1A1E23; --ink:#E8EBEF;
    --ink-soft:#A0A9B4; --ink-faint:#6A727C;
    --rule:#2E343B; --rule-soft:#242A30; --accent:#7BAAE4;
  }
}
:root[data-theme="dark"]{
  --paper:#131619; --sheet:#1A1E23; --ink:#E8EBEF;
  --ink-soft:#A0A9B4; --ink-faint:#6A727C;
  --rule:#2E343B; --rule-soft:#242A30; --accent:#7BAAE4;
}
/* ▲ base.css ここまで ▲ */
:root{
  --a-bg:#DCE8F6; --a-line:#8FB4DC; --a-ink:#173E70;
  --warn:#B0392B; --warn-bg:#FBEEEC;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --a-bg:#1E3352; --a-line:#3F6598; --a-ink:#BDD5F0;
    --warn:#E5776A; --warn-bg:#2E1C1A;
  }
}
:root[data-theme="dark"]{
  --a-bg:#1E3352; --a-line:#3F6598; --a-ink:#BDD5F0;
  --warn:#E5776A; --warn-bg:#2E1C1A;
}
/* ▲ tokens.css ここまで ▲ */
/* ▼ style.css から。直すのは正本のほう（apps/haichi/scripts/parts.mjs の表） ▼ */
*{box-sizing:border-box}
*[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
}
button,input{font:inherit;color:inherit}
button{
  min-height:40px;padding:6px 14px;border:1px solid var(--rule);border-radius:8px;
  background:var(--sheet);cursor:pointer;touch-action:manipulation;
}
button:hover{border-color:var(--ink-faint)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.danger{color:var(--warn);border-color:var(--warn-bg);background:var(--warn-bg)}
button.ghost{background:transparent;border-style:dashed}
button[aria-pressed="true"],button.on{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink);font-weight:700}
button:disabled{opacity:.4;cursor:default}
.sp{flex:1}
.hint{font-size:13px;color:var(--ink-soft);margin:6px 0 0}
ruby rt{font-size:.45em;font-weight:400;color:var(--ink-soft)}

/* ---- ① えらぶ ---- */
.home{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.hbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.hbar h1{font-size:20px;margin:0}
.hscenes>button{font-size:14px;padding:6px 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:14px;background:var(--sheet);overflow:hidden}
.card .go{display:flex;flex-direction:column;align-items:stretch;gap:6px;border:0;border-radius:0;padding:12px 12px 14px;background:none;min-height:0;text-align:center}
.card .go svg{width:100%;height:150px}
.card .go .nm{font-size:26px;font-weight:700;line-height:1.5}
.card .fix{position:absolute;top:8px;right:8px;min-height:34px;padding:2px 10px;font-size:13px;background:var(--sheet)}
.data{margin-top:28px;border-top:1px solid var(--rule-soft);padding-top:12px;color:var(--ink-soft)}
.data summary{cursor:pointer;font-size:14px}
.data .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.filebtn{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);cursor:pointer;color:var(--ink)}

/* ---- ② 見せる ---- */
.show{display:flex;flex-direction:column;height:100vh;height:100dvh}
.tools{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule-soft)}
.tools .tb{min-height:40px;font-size:14px;color:var(--ink-soft)}
.tools .tb[aria-pressed="true"],.tools .tb.on{color:var(--a-ink)}
.stitle{margin:0 0 0 6px;font-size:clamp(26px,3.6vh,48px);line-height:1.3}
.seg{display:inline-flex}
.seg>button{border-radius:0}
.seg>button:first-child{border-radius:8px 0 0 8px}
.seg>button:last-child{border-radius:0 8px 8px 0}
.seg>button+button{margin-left:-1px}
.stage{flex:1;min-height:0;display:flex;gap:10px;padding:10px}
#stageSvg{flex:1;min-width:0;height:100%}
.away{flex:0 0 auto;width:clamp(150px,13vw,240px);display:flex;flex-direction:column;gap:12px;overflow:auto;
  border-left:1px solid var(--rule-soft);padding-left:12px}
.away:empty{display:none}
.away h3{margin:0 0 4px;font-size:clamp(18px,2.4vh,28px)}
.away .icons{display:flex;flex-wrap:wrap;gap:8px}
.away figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(14px,1.8vh,22px);font-weight:700;text-align:center}
.away figure svg{width:clamp(56px,7vh,96px);height:clamp(56px,7vh,96px)}

/* 大きく映す */
.bigmsg{display:none;flex:none;position:relative;z-index:2;margin:0;padding:2vh 64px 1.4vh;background:var(--paper);text-align:center;font-size:clamp(32px,7vh,96px);font-weight:700;line-height:1.5;letter-spacing:.04em}
.bigmsg rt{font-size:.38em}
.show.big .bigmsg{display:block}
.show.big .tools,.show.big .away{display:none}
.show.big .stage{padding:2.5vh 2vw 3vh}
.bigexit{position:fixed;z-index:3;top:10px;right:10px;min-height:44px;width:44px;padding:0;font-size:22px;color:var(--ink-faint);background:transparent;border-color:transparent}
.bigexit:hover{border-color:var(--rule)}

/* SVG の文字・線 */
svg text{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",sans-serif}
.lb{fill:var(--ink);font-weight:700}
.rb{fill:var(--ink-soft)}
.lbox{fill:var(--sheet);stroke:var(--ink);stroke-width:3}
.lead{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round}
.lead-halo{stroke:var(--sheet);stroke-width:10;stroke-linecap:round;fill:none}
.lead-dot{fill:var(--ink);stroke:var(--sheet);stroke-width:3}
.cap{fill:var(--ink-soft);font-weight:700}
.cut{stroke:var(--ink-faint);stroke-width:3;stroke-dasharray:14 10}
.chair.ghost{opacity:.35}
.grid{pointer-events:none}
.grid line{stroke:rgba(29,33,38,.28);stroke-width:2}
.grid circle{fill:rgba(255,255,255,.85);stroke:rgba(29,33,38,.55);stroke-width:2}
.snapmark{fill:none;stroke:var(--accent);stroke-width:5;pointer-events:none}
.selbox{fill:none;stroke:var(--accent);stroke-width:6;stroke-dasharray:18 10}

/* ---- ③ つくる ---- */
.edit{display:flex;flex-direction:column;min-height:100vh}
.ebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-bottom:1px solid var(--rule-soft)}
.fld{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.fld input{width:9em;min-height:40px;padding:4px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:16px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px}
.gridsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.gridsel .seg>button{min-height:36px;padding:4px 10px;font-size:13px}
.ebody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px}
.ecanvas{display:flex;flex-direction:column;gap:10px;min-width:0}
#editSvg{width:100%;height:min(62vh,620px);background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;touch-action:none}
#editSvg .it{cursor:grab}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--a-line);background:var(--a-bg);border-radius:10px}
.selbar strong{margin-right:4px}
.swatches{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.swatches .sw{width:40px;min-height:40px;padding:0;border:2px solid var(--rule);border-radius:8px}
.swatches .sw.on{border:3px solid var(--ink);box-shadow:0 0 0 2px var(--sheet) inset}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lists .wide{grid-column:1/-1}
.lists h3{margin:0 0 4px;font-size:14px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:6px;border:1px dashed var(--rule);border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 6px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.chip .pl{font-size:12px;color:var(--ink-soft)}
.chip button{min-height:34px;padding:2px 8px;font-size:12px}
.palette{display:flex;flex-direction:column;gap:8px;min-width:0}
.tabs{display:flex}
.tabs button{flex:1;border-radius:0}
.tabs button:first-child{border-radius:8px 0 0 8px}
.tabs button:last-child{border-radius:0 8px 8px 0}
.tabs button+button{margin-left:-1px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.dest{width:100%}
.dest>button{flex:1;font-size:13px}
.dest:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto;max-height:70vh}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px;line-height:1.3}
.tiles svg{width:54px;height:54px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:10px;font-size:14px;z-index:10}

@media (max-width:820px){
  .ebody{grid-template-columns:1fr}
  .away{width:120px}
}

/* ---- 印刷 ----
   1つの配置＝A4 1枚。図が横長なら横向き（名前つきページ land）、縦長なら縦向き（port）。
   上に活動名と日付欄、残りを図にあてる。紙は白、色は画面の配色（暗い配色）によらない */
.pdlg{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:18px 20px;width:min(520px,calc(100vw - 32px))}
.pdlg::backdrop{background:rgba(0,0,0,.35)}
.pdlg h2{font-size:18px;margin:0}
.pdlg .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pdlg .row.end{justify-content:flex-end;margin-bottom:0}
.plist{max-height:50vh;overflow:auto;border:1px solid var(--rule-soft);border-radius:8px;padding:4px 10px}
.plist label{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.plist input{width:22px;height:22px}
.printarea{display:none}
@page land{size:A4 landscape;margin:10mm}
@page port{size:A4 portrait;margin:10mm}
@media print{
  html,body{height:auto;background:#fff}
  body>*:not(.printarea){display:none!important}
  .printarea{display:block;color:#1D2126}
  .pg{break-after:page;display:flex;flex-direction:column;overflow:hidden}
  .pg:last-child{break-after:auto}
  .pg.land{page:land;width:277mm;height:189mm}
  .pg.port{page:port;width:190mm;height:276mm}
  .pg .ph{display:flex;align-items:flex-end;gap:12px;border-bottom:.5mm solid #1D2126;padding-bottom:1.5mm;margin-bottom:3mm}
  .pg .ph h1{font-size:20pt;line-height:1.2;margin:0;flex:1}
  .pg .ph rt{color:#5A6470}
  .pg .ph .date{font-size:12pt;white-space:pre}
  .pg .pb{flex:1;min-height:0;display:flex;gap:4mm}
  .pg .pb svg{flex:1;min-width:0;width:100%;height:100%}
  .pg .away{display:block;width:38mm;font-size:10pt}
  .pg .away h3{font-size:11pt;margin:0 0 1mm}
  .pg .away svg{width:16mm;height:16mm}
  .pg .away .icons{display:flex;flex-wrap:wrap;gap:1mm}
  .pg .away figure{margin:0;text-align:center}
}

/* 床の色の見本。色だけで伝えないよう名前も書く */
.sw.bg{min-width:44px;min-height:34px;padding:2px 8px;font-size:13px;border:1px solid var(--rule);color:#1D2126;background:var(--sheet)}
.sw.bg.on{outline:3px solid var(--accent);outline-offset:1px;font-weight:700}

/* 編集画面の拡大・縮小（ホイール・2本指・ボタン）。ボタンは図の右上に重ねる */
.ewrap{position:relative}
.zoombar{position:absolute;top:8px;right:8px;display:flex;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.zoombar button{border:none;border-radius:0;min-width:44px;min-height:40px;font-weight:700}
.zoombar #zReset{min-width:64px;font-variant-numeric:tabular-nums;border-left:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft)}

/* 矢印をのばす：先と元の となりの交点に出す＋、先と元の上の－ */
.amark{cursor:pointer}
.amark circle{fill:#FFFFFF;stroke:var(--accent);opacity:.95}
.amark path{stroke:var(--accent);fill:none;stroke-linecap:round}
.amark.shrink circle{fill:#FFF3F1;stroke:#B0392B}
.amark.shrink path{stroke:#B0392B}

/* 児童の並び：横・縦の人数 */
.kgrid{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.kgrid .seg{display:inline-flex;align-items:center}
.kgrid b{min-width:2em;text-align:center;font-variant-numeric:tabular-nums}

/* 表示の設定（編集画面の上の帯から開く小さな板） */
.dispmenu{position:relative}
.dispmenu summary{list-style:none;cursor:pointer;min-height:40px;display:flex;align-items:center;padding:6px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-weight:700}
.dispmenu summary::-webkit-details-marker{display:none}
.dispmenu summary::after{content:"▾";margin-left:6px;color:var(--ink-soft)}
.dispmenu[open] summary{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink)}
.dpanel{position:absolute;z-index:5;top:calc(100% + 6px);right:0;display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.12);white-space:nowrap}

/* 1366px で上の帯を1段に収める：名前・よみの欄を詰め、間を狭く */
.ebar{gap:6px 8px}
.ebar .fld input{width:7.5em}
.ebar #eYomi{width:6.5em}
.ebar #eUndo,.ebar #eRedo{min-width:44px;font-size:20px;padding:4px 10px}

/* 名前の吹き出し・引き出し線は 押せない（下の物を選べるように） */
#editSvg .labels{pointer-events:none}

/* まとめて選ぶ：囲みの四角 */
#editSvg .band{fill:rgba(44,92,158,.08);stroke:var(--accent);stroke-width:2px;stroke-dasharray:8 6;vector-effect:non-scaling-stroke}
.peers{font-size:13px;font-weight:700;color:var(--a-ink);background:var(--a-bg);border:1px solid var(--a-line);border-radius:999px;padding:4px 12px}

/* 上の帯と選んだ物の帯：まとまりごとに区切る */
.egroup,.bgroup{display:inline-flex;align-items:center;gap:6px;padding-left:10px;border-left:1px solid var(--rule)}
.selbar>.bgroup:first-of-type{border-left:none;padding-left:0}
#eMore summary{font-size:20px;padding:4px 14px}
#eMore summary::after{content:none}
#eMore .dpanel button{width:100%}
/* パレット：用具・設備／矢印・目印／人 に分けて見出し */
.pgroup{grid-column:1/-1;margin:8px 0 2px;font-size:13px;font-weight:800;color:var(--ink-soft);border-bottom:1px solid var(--rule-soft);padding-bottom:2px}
.pgroup:first-child{margin-top:0}

/* まとめて選んだとき：基準の物は橙の実線の枠 */
#editSvg .it.ref .selbox{stroke:#E07A1F;stroke-dasharray:none!important}
.mref{font-size:13px;font-weight:700;color:#A4520C}
.mhead{font-size:12px;font-weight:800;color:var(--ink-soft);margin-top:4px}
#mAlign .dpanel{left:0;right:auto}

/* パレットのチップ：横長以外は 絵を左に大きく */
.tiles button.side{flex-direction:row;justify-content:flex-start;gap:6px;padding:2px 6px 2px 2px;min-height:64px;text-align:left}
.tiles button.side svg{flex:0 0 auto;width:60px;height:60px}
.tiles button.side span{flex:1;min-width:0}
/* 選んだ物：点線の枠ではなく 薄い半透明の青を重ねる（基準の物は 薄い橙） */
#editSvg .selbox{fill:rgba(44,92,158,.22)!important;stroke:none!important}
#editSvg .it.ref .selbox{fill:rgba(224,122,31,.26)!important;stroke:none!important}
/* 絵を左に置くので 2列（名前が1行〜2行で読める幅） */
.tiles{grid-template-columns:repeat(2,1fr)}
.tiles button.side span{font-size:13px}

/* 上の帯のボタン：アイコンの下に文字 */
.ebar .tbtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:54px;min-height:48px;padding:3px 8px;font-size:11px;font-weight:700;line-height:1.15}
.ebar .tbtn .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ebar .tbtn small{display:block;font-size:10px;font-weight:400;color:var(--ink-soft)}
.ebar summary.tbtn::after{content:none!important}
.ebar .tbtn.primary .ic{stroke:#fff}
.ebar #eUndo,.ebar #eRedo{font-size:11px;min-width:54px}
#eSelect[aria-pressed="true"]{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink)}
#editSvg.selecting{cursor:crosshair}
#eMore summary.tbtn{font-size:11px;padding:3px 8px}

/* 「設置」がオフ：パレットをしまって図を広く */
.ebody.nopal{grid-template-columns:minmax(0,1fr)}
.ebody.nopal .palette{display:none}
#eAdd[aria-pressed="true"]{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink)}
#eGridIc .ic{width:22px;height:22px}
/* グリッドの選択：アイコンのボタン */
#eGrid .gbtn{min-width:44px;padding:4px 8px}
#eGrid .gbtn .ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
/* パレットの分類：畳める見出し */
.pgrp{margin-bottom:6px}
.pgrp>summary.pgroup{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:6px 2px}
.pgrp>summary.pgroup::-webkit-details-marker{display:none}
.pgrp>summary.pgroup::before{content:"▸";font-size:12px;color:var(--ink-soft)}
.pgrp[open]>summary.pgroup::before{content:"▾"}
.pgrp>summary small{margin-left:auto;font-weight:400;color:var(--ink-faint)}
#pItems:has(.pgrp){display:block}
.tiles.in{max-height:none;overflow:visible}

/* 色：見本にない色を選ぶ丸（中に色の選び方） */
.swatches .sw.free{position:relative;display:inline-block;overflow:hidden;cursor:pointer}
.swatches .sw.free input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
#kNumOpt{display:inline-flex;align-items:center;gap:4px}
/* ▲ style.css ここまで ▲ */
</style>
</head>
<body>

<!-- ① えらぶ：活動カード -->
<main id="vHome" class="home">
  <header class="hbar">
    <h1 id="hTitle">机の配置図</h1>
    <div id="hScenes" class="seg hscenes" role="group" aria-label="場所"></div>
    <span class="sp"></span>
    <button type="button" id="hPrint" class="ghost">一括印刷</button>
    <button type="button" id="hNew" class="ghost">＋ 新規作成</button>
  </header>
  <div id="cards" class="cards"></div>
  <details class="data">
    <summary>データの書き出し・読み込み</summary>
    <div class="row">
      <button type="button" id="dExport">書き出す（JSON）</button>
      <label class="filebtn">読み込む<input type="file" id="dImport" accept="application/json,.json" hidden></label>
      <button type="button" id="dReset" class="danger">初期配置に戻す</button>
    </div>
    <p class="hint" id="dHint">配置はこの端末のブラウザに保存されます。別の端末へは書き出したファイルで移行します。</p>
  </details>
</main>

<!-- ② 見せる：モニターに映す -->
<section id="vShow" class="show" hidden>
  <div class="tools">
    <button type="button" id="sBack" class="tb" aria-label="戻る">←</button>
    <h2 id="sTitle" class="stitle"></h2>
    <span class="sp"></span>
    <div class="seg" id="sGroup" role="group" aria-label="机の数">
      <button type="button" id="sOne" class="tb">1人</button><button type="button" id="sFour" class="tb">4人</button>
    </div>
    <button type="button" id="sFlip" class="tb" aria-pressed="false">左右反転</button>
    <button type="button" id="sSides" class="tb" aria-pressed="true">側面図</button>
    <button type="button" id="sChair" class="tb" aria-pressed="false">椅子</button>
    <button type="button" id="sRuby" class="tb" aria-pressed="true">ふりがな</button>
    <button type="button" id="sFrame" class="tb" aria-pressed="false" hidden>周りも映す</button>
    <button type="button" id="sText" class="tb" aria-pressed="true" hidden>エリア名</button>
    <button type="button" id="sOutline" class="tb" aria-pressed="false">輪郭を強調</button>
    <button type="button" id="sEdit" class="tb">編集</button>
    <button type="button" id="sPrint" class="tb">印刷</button>
    <button type="button" id="sBig" class="primary">全画面で映す</button>
  </div>
  <p id="bigMsg" class="bigmsg" hidden><ruby>机<rt>つくえ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>をこの<ruby>形<rt>かたち</rt></ruby>にしてね</p>
  <button type="button" id="bigExit" class="bigexit" hidden aria-label="全画面を終了">×</button>
  <div class="stage">
    <svg id="stageSvg" preserveAspectRatio="xMidYMid meet" role="img"></svg>
    <aside id="away" class="away"></aside>
  </div>
</section>

<!-- ③ つくる・なおす -->
<section id="vEdit" class="edit" hidden>
  <!-- 上の帯：①配置そのもの（名前・読み・反転）②場所とグリッド ③見え方 ／ 右：取り消し・映す・その他。毎回は触らない物は ▾ の中 -->
  <header class="ebar">
    <button type="button" id="eBack" class="tbtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>戻る</span></button>
    <div class="egroup">
      <label class="fld">配置名<input id="eName" maxlength="20"></label>
      <label class="fld">読み<input id="eYomi" maxlength="30" placeholder="ふりがな"></label>
    </div>
    <div class="egroup">
      <button type="button" id="eAdd" class="tbtn" aria-pressed="true" title="右に 置く物（用具・目印・人）を出す・しまう"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17.5 14v7M14 17.5h7"/></svg><span>設置</span></button>
      <button type="button" id="eTurn" class="tbtn" title="場所を時計回りに90°回転（置いた物も一緒に回ります）"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>回転</span></button>
      <button type="button" id="eSelect" class="tbtn" aria-pressed="false" title="オン：ドラッグで囲んでまとめて選ぶ（ホイールの拡大縮小は止まる）"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="13" height="13" rx="1" stroke-dasharray="3 2.5"/><path d="M12 12l8.5 3.2-3.6 1.4-1.4 3.6z"/></svg><span>選択</span></button>
      <details class="dispmenu" id="eGridMenu">
        <summary class="tbtn" title="グリッドの細かさ・線の表示"><span id="eGridIc"></span><span>グリッド</span></summary>
        <div class="dpanel">
          <div id="eGrid" class="seg" role="group" aria-label="グリッドの細かさ"></div>
          <label class="chk"><input type="checkbox" id="eGridShow" checked>グリッド線を表示</label>
        </div>
      </details>
      <details class="dispmenu" id="eDisp">
        <summary class="tbtn" title="床の色・輪郭・寸法・エリア名"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>表示</span></summary>
        <div class="dpanel">
          <div id="eBgBox" class="gridsel">床の色<div id="eBg" class="seg" role="group" aria-label="床の色"></div></div>
          <div id="eLinesBox" class="gridsel" hidden>床のライン<div id="eLines" class="seg" role="group" aria-label="床のライン"></div></div>
          <label class="chk"><input type="checkbox" id="eOutline">輪郭を強調</label>
          <label class="chk"><input type="checkbox" id="eDim">寸法</label>
          <label id="eTextBox" class="chk" hidden><input type="checkbox" id="eText">エリア名</label>
          <label class="chk" title="映す画面で左右反転してよい"><input type="checkbox" id="eFlip">映す画面で反転を許可</label>
        </div>
      </details>
    </div>
    <span id="ePeers" class="peers" hidden></span>
    <span class="sp"></span>
    <button type="button" id="eUndo" class="tbtn" title="元に戻す（Ctrl+Z）" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>元に戻す</span></button><button type="button" id="eRedo" class="tbtn" title="やり直し（Ctrl+Y）" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>やり直し</span></button>
    <button type="button" id="eShow" class="tbtn primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>映す</span></button>
    <details class="dispmenu" id="eMore">
      <summary class="tbtn" title="この配置の複製・削除"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>その他</span></summary>
      <div class="dpanel">
        <button type="button" id="eCopy">この配置を複製</button>
        <button type="button" id="eDel" class="danger">この配置を削除</button>
      </div>
    </details>
  </header>
  <div class="ebody">
    <div class="ecanvas">
      <!-- まとめて選んだとき：①何個・基準 ②揃える▾・大きさ ③複製・削除・解除 -->
      <div id="multiBar" class="selbar" hidden>
        <strong id="mCount"></strong>
        <span class="bgroup">
          <span id="mRef" class="mref"></span>
          <button type="button" id="mRefNext" title="揃えるときの基準（橙の枠）を 選んだ物の中で切り替える">基準を変える</button>
        </span>
        <span class="bgroup">
          <details class="dispmenu" id="mAlign">
            <summary>揃える</summary>
            <div class="dpanel">
              <div class="mhead">基準の物に合わせる</div>
              <div class="seg"><button type="button" data-ref="x" title="基準と同じ x（縦一列）に並べる">縦一列（x を合わせる）</button><button type="button" data-ref="y" title="基準と同じ y（横一列）に並べる">横一列（y を合わせる）</button></div>
              <div class="mhead">等間隔に並べる</div>
              <div class="seg"><button type="button" data-al="hdist">横に等間隔</button><button type="button" data-al="vdist">縦に等間隔</button></div>
              <div class="mhead">端を揃える</div>
              <div class="seg"><button type="button" data-al="left">左</button><button type="button" data-al="hcenter">左右中央</button><button type="button" data-al="right">右</button></div>
              <div class="seg"><button type="button" data-al="top">上</button><button type="button" data-al="vcenter">上下中央</button><button type="button" data-al="bottom">下</button></div>
            </div>
          </details>
          <span class="seg" role="group" aria-label="大きさ（まとめて）"><button type="button" id="mSmall" aria-label="まとめて縮小">－</button><button type="button" id="mReal" title="実寸（100%）に戻す">100%</button><button type="button" id="mBig" aria-label="まとめて拡大">＋</button></span>
        </span>
        <span class="bgroup">
          <button type="button" id="mDup">複製</button>
          <button type="button" id="mDel" class="danger">削除</button>
          <button type="button" id="mNone">選択を解除</button>
        </span>
      </div>
      <!-- 選んだ物の操作：①種類（状態・判型・色・文字）②形（大きさ・回転・人数・矢印）③そのほか -->
      <div id="selBar" class="selbar" hidden>
        <strong id="selName"></strong>
        <span class="bgroup">
          <span id="selState" class="seg"></span>
          <button type="button" id="selSize"></button>
          <span id="selColors" class="swatches"></span>
          <label id="selTextBox" class="fld" hidden><span id="selTextCap">文字</span><input id="selText" maxlength="16" placeholder="例：待機場所"></label>
          <span id="dimMode" class="seg" role="group" aria-label="寸法の文字" hidden><button type="button" data-dim="auto" title="いまの長さを出す">自動</button><button type="button" data-dim="man" title="入れた文字を出す">手動</button></span>
        </span>
        <span class="bgroup">
          <span class="seg" role="group" aria-label="大きさ"><button type="button" id="selSmall" aria-label="縮小">－</button><button type="button" id="selReal">100%</button><button type="button" id="selBig" aria-label="拡大">＋</button></span>
          <button type="button" id="selRot">回転 ↻</button>
          <span id="selLen" class="kgrid" hidden>長さ<span class="seg"><button type="button" data-len="-1" aria-label="短く">－</button><b id="lenV"></b><button type="button" data-len="1" aria-label="長く">＋</button></span></span>
          <span id="selGrid" class="kgrid" hidden>横<span class="seg"><button type="button" data-k="x" data-d="-1" aria-label="横を1人減らす">－</button><b id="kNx">1</b><button type="button" data-k="x" data-d="1" aria-label="横を1人増やす">＋</button></span>
            縦<span class="seg"><button type="button" data-k="y" data-d="-1" aria-label="縦を1人減らす">－</button><b id="kNy">1</b><button type="button" data-k="y" data-d="1" aria-label="縦を1人増やす">＋</button></span><span id="kSum"></span>
            <button type="button" id="kNum" aria-pressed="false" title="絵の左上に出席番号を出す">出席番号</button>
            <span id="kNumOpt" hidden>はじめ<span class="seg"><button type="button" data-n0="-1" aria-label="はじめの番号を1つ小さく">－</button><b id="kN0">1</b><button type="button" data-n0="1" aria-label="はじめの番号を1つ大きく">＋</button></span><button type="button" id="kOrd" title="番号の並べ方（横順＝左上から右へ、縦順＝左上から下へ）">横順</button></span></span>
          <button type="button" id="selPath" aria-pressed="false" hidden>矢印を編集</button>
        </span>
        <span class="bgroup">
          <button type="button" id="selLabel" aria-pressed="false">名称を表示</button>
          <label id="selLnameBox" class="fld" hidden>名称<input id="selLname" maxlength="20"></label>
          <span id="selStack" class="seg" role="group" aria-label="重なりの順"><button type="button" data-z="back" title="いちばん後ろへ">最背面</button><button type="button" data-z="down" title="1つ後ろへ">後面へ</button><button type="button" data-z="up" title="1つ前へ">前面へ</button><button type="button" data-z="front" title="いちばん前へ">最前面</button></span>
          <button type="button" id="selDel" class="danger">削除</button>
        </span>
      </div>
      <div class="ewrap">
        <svg id="editSvg" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="zoombar" role="group" aria-label="拡大・縮小"><button type="button" id="zOut" aria-label="縮小">－</button><button type="button" id="zReset" title="全体を見る" disabled>100%</button><button type="button" id="zIn" aria-label="拡大">＋</button></div>
      </div>
      <div class="lists" id="eLists">
        <div><h3>左のフック</h3><div id="lHookL" class="chips"></div></div>
        <div><h3>右のフック</h3><div id="lHookR" class="chips"></div></div>
        <div class="wide"><h3>収納物</h3><div id="lAway" class="chips"></div></div>
      </div>
    </div>
    <div class="palette">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="top" aria-selected="true">机上</button>
        <button type="button" role="tab" data-tab="hang" aria-selected="false">フック</button>
        <button type="button" role="tab" data-tab="away" aria-selected="false">収納</button>
      </div>
      <div id="pDest" class="seg dest"></div>
      <div id="pItems" class="tiles"></div>
    </div>
  </div>
</section>

<!-- 印刷：まとめて印刷で刷る配置を選ぶ -->
<dialog id="pDlg" class="pdlg" aria-labelledby="pDlgT">
  <h2 id="pDlgT">一括印刷</h2>
  <p class="hint">1つの配置を A4 1枚に印刷します。用紙の向きは図の形に合わせて自動で決まります。</p>
  <div class="row"><button type="button" id="pAll">すべて選択</button><button type="button" id="pNone">すべて解除</button></div>
  <div id="pList" class="plist"></div>
  <div class="row end"><button type="button" id="pCancel">キャンセル</button><button type="button" id="pGo" class="primary">印刷する</button></div>
</dialog>
<!-- 印刷するページ（印刷の間だけ中身が入る） -->
<div id="printArea" class="printarea" aria-hidden="true"></div>

<div id="toast" role="status" hidden></div>

<script>
/* ▼ data.js から。直すのは正本のほう（apps/haichi/scripts/parts.mjs の表） ▼ */
/* ===== 机・用具・標準配置の正本 =====
   寸法はすべて mm。机の上から見た座標は
     x: 0（児童の左）→ 650（児童の右）
     y: 0（黒板がわ＝前）→ 450（児童がすわる がわ＝後ろ）
   用具の名前は {漢字|よみ} でふりがなを付ける。 */

/* ---- 場所（モード）：床の大きさ・置ける物・細かい設定 ----
   「机の上」に加えて、教室・体育館・運動場の配置図を作れる（メニューで場所を選ぶ）。
   useScene で DESK・GRID_LEVELS・K がいまの場所に切り替わる（描画・編集の仕組みは机と同じ）。
   K は文字・線・余白の見た目の倍率：床の幅を机の幅 650 で割ったもの（広い場所ほど大きく描く）。
   items: その場所に置ける物の id（机は全種）。grid: あらい→ふつう→こまかい（各2倍、包含が保たれる）。 */
var SCENES = {
  /* 机：写真の机（天板は平ら・物入れは児童がわに開く・フックは左右両側）に合わせる */
  desk: {
    id: 'desk', name: '机の上', title: '机の配置図', desk: true, w: 650, d: 450,
    // 天板：新JIS（JIS S 1021）の 650×450
    top: 25,                 // 天板の厚み
    trayV: 25, trayH: 105,   // 物入れ：天板の下 25〜130
    trayInset: 22,
    hookY: 225,              // フックの前後位置（前から）。左右の面の中央
    hookV: 48,               // フックの高さ（天板の上面から下へ）
    legInset: 28,
    crop: 560,               // 横から見た図は上から 560mm までを描き、脚の下は切る
    grid: [
      { id: 'coarse', name: '粗い',   nx: 6,  ny: 4 },    // 約108×113mm
      { id: 'normal', name: '標準',   nx: 12, ny: 8 },    // 約54×56mm
      { id: 'fine',   name: '細かい', nx: 24, ny: 16 }    // 約27×28mm
    ],
    msg: '<ruby>机<rt>つくえ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>をこの<ruby>形<rt>かたち</rt></ruby>にしてね'
  },
  class: {   // 普通教室 7m×9m（利用者指定。標準的な63㎡級）
    id: 'class', name: '教室', title: '教室の配置図', w: 7000, d: 9000,
    grid: [
      { id: 'coarse', name: '粗い',   nx: 7,  ny: 9 },    // 1000mm
      { id: 'normal', name: '標準',   nx: 14, ny: 18 },   // 500mm
      { id: 'fine',   name: '細かい', nx: 28, ny: 36 }    // 250mm
    ],
    items: ['cdesk', 'ctable', 'cshelf', 'person', 'rowdot', 'rowline', 'rowseno', 'arrow'],
    msg: '<ruby>教室<rt>きょうしつ</rt></ruby>をこの<ruby>形<rt>かたち</rt></ruby>にしてね'
  },
  gym: {     // 体育館 20m×30m（利用者指定）
    id: 'gym', name: '体育館', title: '体育館の配置図', w: 20000, d: 30000,
    grid: [
      { id: 'coarse', name: '粗い',   nx: 4,  ny: 6 },    // 5000mm
      { id: 'normal', name: '標準',   nx: 8,  ny: 12 },   // 2500mm
      { id: 'fine',   name: '細かい', nx: 16, ny: 24 }    // 1250mm
    ],
    items: ['gbox', 'gboard', 'gmat', 'gbeam', 'gbar', 'gtora', 'gball', 'gline', 'person', 'rowdot', 'rowline', 'rowseno', 'arrow'],
    msg: '<ruby>体育館<rt>たいいくかん</rt></ruby>をこの<ruby>形<rt>かたち</rt></ruby>にしてね'
  },
  field: {   // 運動場 40m×60m（利用者指定）
    id: 'field', name: '運動場', title: '運動場の配置図', w: 40000, d: 60000,
    grid: [
      { id: 'coarse', name: '粗い',   nx: 8,  ny: 12 },   // 5000mm
      { id: 'normal', name: '標準',   nx: 16, ny: 24 },   // 2500mm
      { id: 'fine',   name: '細かい', nx: 32, ny: 48 }    // 1250mm
    ],
    items: ['gbar', 'funten', 'fsand', 'ftire', 'fgoal', 'fcone', 'fmark', 'gball', 'gline', 'person', 'rowdot', 'rowline', 'rowseno', 'arrow'],
    msg: '<ruby>運動場<rt>うんどうじょう</rt></ruby>をこの<ruby>形<rt>かたち</rt></ruby>にしてね'
  }
};
var SCENE_ORDER = ['desk', 'class', 'gym', 'field'];   // メニューの並び
var SCENE = SCENES.desk;
var DESK = SCENE;                 // いまの床（机モードでは机そのもの）
var GRID_LEVELS = SCENE.grid;
var K = 1;                       // 文字・線・余白の倍率（床の幅÷机の幅650）
function useScene(id, rot) {
  SCENE = SCENES[id] || SCENES.desk;
  rot = SCENE.desk ? 0 : ((rot | 0) % 360 + 360) % 360;
  if (rot) SCENE = turnedScene(SCENE, rot);
  DESK = SCENE; GRID_LEVELS = SCENE.grid; K = SCENE.k || SCENES[SCENE.id].w / 650;   // k：倍率を幅から決めない場所（広い場の余白が広がりすぎないように）
}
/* 場所を90°ずつ回した姿（配置ごとの rot）。幅と奥行き・グリッドの縦横を入れかえ、床は描くときに回す（draw.js の floorTopSvg）。
   置いた物は 回したときに座標と向きを変える（app の turnLayout）。元の場所は SCENE.base */
var TURN_CACHE = {};
function turnedScene(sc, rot) {
  var key = sc.id + '@' + rot;
  if (TURN_CACHE[key]) return TURN_CACHE[key];

}, true);   // 先に（捕まえる段で）調べる：図の中の物を押すと 描き直しで押した要素が外れ、あとからでは どこを押したか分からない
/* ▲ pointer.js ここまで ▲ */
/* ▼ boot.js から。直すのは正本のほう（apps/haichi/scripts/parts.mjs の表） ▼ */
/* 配置図：起動（最初の画面と、共有のときの受け取り） */
renderHome();

/* ---- 共有（GAS版）：起動したら共有の配置を受け取り、ほかの人の変更が来たら描き直す ---- */
$('dReset').hidden = Store.kind === 'gas';   // 共有では「標準に戻す」はしない（みんなの配置が消えるため）
$('dHint').textContent = Store.kind === 'gas' ? '配置は校内で共有されています（同時に編集しても統合されます）。書き出しはバックアップに使えます。'
                                              : '配置はこの端末のブラウザに保存されます。別の端末へは書き出したファイルで移行します。';
function refreshView() {
  if (!$('vEdit').hidden && cur) { if (!byId(cur.id)) return renderHome(); useLayout(cur); renderEdit(); renderPalette(); }
  else if (!$('vShow').hidden && cur) { if (!byId(cur.id)) return renderHome(); renderShow(); }
  else renderHome();
}
Store.onPresence = function () { if (!$('vEdit').hidden && cur) peers(); };
function peers() {
  var who = Store.editors ? Store.editors(cur.id) : [];
  $('ePeers').hidden = !who.length;
  $('ePeers').textContent = who.length ? '同時編集中：' + who.join('、') : '';
}
var selU = [];   // 取り込む直前に選んでいた物の名札（store.js が取り込む前に before を呼ぶ）
Store.before = function () { selU = cur ? selected().map(function (i) { return (cur.top[i] || {}).u; }).filter(Boolean) : []; };
Store.start(refreshView, function (id, by, conflict) {
  if (cur && cur.id === id && !$('vEdit').hidden) {
    hist = { undo: [], redo: [], last: JSON.stringify(cur) }; histButtons();   // 取り消しは 取り込んだ後から数え直す（相手の変更を戻さないため）
    // 選んでいた物は 番号ではなく名札 u で選び直す（まぜると並び順が変わるため）
    var at = function (u) { for (var i = 0; i < cur.top.length; i++) if (cur.top[i].u === u) return i; return -1; };
    sel = selU.length ? at(selU[selU.length - 1]) : -1;
    msel = selU.map(at).filter(function (i) { return i >= 0; }); if (msel.length < 2) msel = [];
    if (!conflict) toast((by || '他の先生') + 'さんの変更を反映しました');
  }
  refreshView();
});
/* ▲ boot.js ここまで ▲ */
</script>
</body>
</html>
