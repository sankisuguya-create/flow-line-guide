:root{--paper:#EEF3F7;--ink:#143242;--ink-soft:#4B6C80;--marker:#F0912B;--marker-soft:#FBD9AE;
  --court:#F6F1E4;--band:#FFE7B8;--red:#D7263D;--blue:#1F5FBF;--ok:#0B7A3E;--judge:#3BA55C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"LPB",sans-serif}
svg text{font-family:"LPB",sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;gap:8px;padding:8px;flex-wrap:wrap;align-items:center}
.top h1{font-size:18px;margin:0 8px 0 0}
button{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);
  border-radius:10px;min-height:48px;padding:0 14px;cursor:pointer;touch-action:manipulation}
button[aria-pressed="true"]{background:var(--marker);border-color:var(--marker)}

// 時間の通し番号：全場面を 1本につなぐ
var TOTAL=SCENES.reduce(function(a,s){return a+s.dur},0), clock=0, paused=true, last=null;
