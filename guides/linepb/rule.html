<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ラインポートボール ルール</title>
<style>
:root{--paper:#EEF3F7;--ink:#143242;--ink-soft:#4B6C80;--marker:#F0912B;--marker-soft:#FBD9AE;
  --court:#F6F1E4;--band:#FFE7B8;--red:#D7263D;--blue:#1F5FBF;--ok:#0B7A3E;--judge:#3BA55C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;gap:8px;padding:8px;flex-wrap:wrap;align-items:center}
.top h1{font-size:18px;margin:0 8px 0 0}
button{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);
  border-radius:10px;min-height:48px;padding:0 14px;cursor:pointer;touch-action:manipulation}
button[aria-pressed="true"]{background:var(--marker);border-color:var(--marker)}
#play{width:64px;font-size:20px}
svg{flex:1;min-height:0;width:100%;display:block}
.cap{height:2.1em;overflow:hidden;flex:none;white-space:nowrap;padding:4px 16px 8px;font-size:clamp(30px,4.6vw,58px);font-weight:800;
  text-align:center;line-height:1.45}
rt{font-size:.45em;font-weight:700}
input[type=range]{flex:1;min-width:120px;height:32px}
body.rec .top{display:none}
.kid text{font-weight:900;font-size:22px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.lbl{font-size:20px;font-weight:800;fill:var(--ink-soft);text-anchor:middle}
.big{font-size:64px;font-weight:900;fill:var(--ok);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:10px}
.board{font-size:40px;font-weight:900;text-anchor:middle}
</style>
</head>

  <svg id="svg" viewBox="-60 -150 920 640"></svg>
  <div class="cap" id="cap"></div>
</div>

  (sc.hi||[]).forEach(function(h){ if(t>=h[0]&&t<h[1]) hi=h[2]; });
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="var(--court)" stroke="var(--ink)" stroke-width="4"/>';
  var bandFill=hi==="band"?"var(--band)":"none";
  s+='<rect x="0" y="0" width="'+BAND*M+'" height="'+H+'" fill="'+bandFill+'"/><rect x="'+(W-BAND*M)+'" y="0" width="'+BAND*M+'" height="'+H+'" fill="'+bandFill+'"/>';
  if(hi==="half"){ s+='<rect x="'+BAND*M+'" y="0" width="'+(10-BAND)*M+'" height="'+H+'" fill="var(--red)" opacity=".10"/>'+
     '<rect x="'+10*M+'" y="0" width="'+(10-BAND)*M+'" height="'+H+'" fill="var(--blue)" opacity=".10"/>'+
     '<text class="lbl" x="'+6*M+'" y="'+(H+34)+'" style="font-size:24px;fill:var(--red)">赤のじん</text><text class="lbl" x="'+14*M+'" y="'+(H+34)+'" style="font-size:24px;fill:var(--blue)">青のじん</text>'; }
  [BAND,10,20-BAND].forEach(function(x){ s+='<line x1="'+x*M+'" x2="'+x*M+'" y1="0" y2="'+H+'" stroke="var(--ink)" stroke-width="3"/>'; });
  s+='<circle cx="'+10*M+'" cy="'+5*M+'" r="14" fill="none" stroke="var(--ink)" stroke-width="3"/>';
  [[BAND,0],[BAND,10],[20-BAND,0],[20-BAND,10]].forEach(function(c){ s+='<path d="M'+(c[0]*M-10)+' '+(c[1]*M+8)+'L'+c[0]*M+' '+(c[1]*M-22)+'L'+(c[0]*M+10)+' '+(c[1]*M+8)+'z" fill="var(--marker)" stroke="var(--ink)" stroke-width="2"/>'; });
  if(sc.from!==LINE&&!sc.nolbl) s+=''+rb("ゴールマンの{帯|おび}",BAND/2*M+30,H+36,20,"fill:var(--ink-soft);font-weight:800")+'<text class="lbl" x="'+W*0.25+'" y="'+(H+60)+'">20m</text>'+
     '<text class="lbl" x="'+(W+30)+'" y="'+H/2+'">10m</text><text class="lbl" x="'+2*M+'" y="-118">赤ベンチ</text><text class="lbl" x="'+18*M+'" y="-118">青ベンチ</text>';
  if(sc.nocourt) s=drawRot(t);
  svg.setAttribute("viewBox",sc.nocourt?"-40 -135 880 690":"-60 -150 920 640");
  var b=sc.noball?null:ballAt(sc,t), touched={};
  if(sc.score) sc.ball.forEach(function(x){ if(x[0]<=t&&x[1]!=="bA") touched[x[1]]=1; });
  (sc.only||Object.keys(START)).forEach(function(id){ if((sc.hide||[]).indexOf(id)>=0) return; var p=pos(sc,id,t), x=p[0]*M, y=p[1]*M;
    var kr=sc.nocourt?32:20; s+='<g class="kid"><circle cx="'+x+'" cy="'+y+'" r="'+kr+'" fill="'+TEAM[id[0]]+'" stroke="#fff" stroke-width="3"/><text x="'+x+'" y="'+y+'"'+(sc.nocourt?' style="font-size:32px"':'')+'>'+id[1]+'</text>';
    if(touched[id]) s+='<circle cx="'+(x+18)+'" cy="'+(y-18)+'" r="11" fill="var(--ok)" stroke="#fff" stroke-width="2"/><path d="M'+(x+12)+' '+(y-18)+'l4 4 l8 -8" stroke="#fff" stroke-width="3" fill="none"/>';
    s+='</g>'; });
  if(!sc.noball){ var bx=b.p[0]*M+(b.fly?0:16), by=b.p[1]*M+(b.fly?0:14);
    s+='<circle cx="'+bx+'" cy="'+by+'" r="10" fill="#fff" stroke="var(--ink)" stroke-width="3"/>'; }
  (sc.marks||[]).forEach(function(m){ if(t<m[0]||t>=m[1]) return; var plain=m[4].replace(/\{([^|}]+)\|[^}]+\}/g,"$1"), w=0; for(var i=0;i<plain.length;i++) w+=cw(plain[i])*32; w+=40; var x=m[2]*M, y=m[3]*M;
    s+='<rect x="'+(x-w/2)+'" y="'+(y-32)+'" width="'+w+'" height="64" rx="32" fill="#fff" stroke="'+m[5]+'" stroke-width="4"/>'+rb(m[4],x,y+12,32,"font-weight:900;fill:"+m[5])+''; });
  (sc.marks||[]).forEach(function(m){ if(t<m[0]||t>=m[0]+1.6||m[5]!=="var(--red)"||!/！$/.test(m[4])) return; var q=null,qd=1e9; ["jA","jB","jC","jD","jE"].forEach(function(j){ var p=pos(sc,j,t), d=Math.hypot(p[0]-m[2],p[1]-m[3]); if(d<qd){qd=d;q=p;} });
    s+='<text x="'+q[0]*M+'" y="'+(q[1]*M-34)+'" style="font-size:30px;font-weight:900;text-anchor:middle;fill:var(--judge);paint-order:stroke;stroke:#fff;stroke-width:6px">ピッ！</text>'; });
  if(sc.board){ var bd=sc.board[0]; sc.board.forEach(function(x){ if(t>=x[0]) bd=x; });
    s+='<text class="board" x="'+W*0.72+'" y="'+(H+66)+'"><tspan style="fill:var(--red)">赤 '+bd[1]+'</tspan> − <tspan style="fill:var(--blue)">'+bd[2]+' 青</tspan></text>'; }
  (sc.bigs||[]).forEach(function(g){ if(t>=g[0]&&t<g[1]) s+=rb(g[2],sc.nocourt?W/2:(g[2].replace(/\{([^|}]+)\|[^}]+\}/g,"$1").length>8?W/2:W*0.66),sc.nocourt?-50:-60,64,"font-weight:900;fill:"+g[3]+";paint-order:stroke;stroke:#fff;stroke-width:10px"); });
  if(sc.timer&&t<sc.timer[1]+2){ var u=Math.max(0,Math.min(1,(t-sc.timer[0])/(sc.timer[1]-sc.timer[0]))), r=Math.round(180*(1-u));
    s+='<text class="big" x="'+W*0.66+'" y="-60" style="fill:var(--ink)">'+Math.floor(r/60)+':'+('0'+r%60).slice(-2)+'</text>'; }
  svg.innerHTML=s;
  var c=""; sc.cap.forEach(function(x){ if(t>=x[0]) c=x[1]; }); var cp=$("cap"); cp.style.fontSize=""; cp.innerHTML=ruby(c); var fs=parseFloat(getComputedStyle(cp).fontSize); while(cp.scrollWidth>cp.clientWidth&&fs>18){ fs-=2; cp.style.fontSize=fs+"px"; }
}
// 時間の通し番号：全場面を 1本につなぐ
var TOTAL=SCENES.reduce(function(a,s){return a+s.dur},0), clock=0, paused=true, last=null;
function locate(T){ var a=0; for(var i=0;i<SCENES.length;i++){ if(T<a+SCENES[i].dur||i===SCENES.length-1) return [i,Math.min(T-a,SCENES[i].dur)]; a+=SCENES[i].dur; } }
function render(){ var l=locate(clock); draw(l[0],l[1]); $("scrub").value=Math.round(clock/TOTAL*1000);
  Array.prototype.forEach.call($("scenes").children,function(b,i){b.setAttribute("aria-pressed",i===l[0])}); }
function frame(now){ if(last!==null&&!paused){ clock+=Math.min(.1,(now-last)/1000); if(clock>=TOTAL){clock=TOTAL;paused=true;$("play").textContent="▶";document.title="DONE";} render(); }
  last=now; requestAnimationFrame(frame); }
$("scenes").innerHTML=SCENES.map(function(s,i){return '<button data-i="'+i+'">'+(i+1)+' '+s.name+'</button>'}).join("");
$("scenes").onclick=function(e){var b=e.target.closest("button"); if(!b) return; var a=0; for(var i=0;i<+b.dataset.i;i++) a+=SCENES[i].dur; clock=a; render();};
$("play").onclick=function(){ if(clock>=TOTAL) clock=0; paused=!paused; this.textContent=paused?"▶":"❚❚"; };
$("scrub").oninput=function(){ paused=true; $("play").textContent="▶"; clock=TOTAL*this.value/1000; render(); };
if(/rec/.test(location.search)){ document.body.classList.add("rec"); setTimeout(function(){paused=false;},800); }
render(); requestAnimationFrame(frame);
</script>
