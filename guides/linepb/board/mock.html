     線を書く・置く・消すは平面で行う（立体のときに道具を押すと平面に戻る）。 -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",

<style>
:root{--bg:#f4f1ea;--ink:#222;--red:#d63a3a;--blue:#2f6fd6;--mv:#1f5fd0;--ps:#d02a2a;--ui:#fff;--sel:#ffd84d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
 height:100vh;display:flex;flex-direction:column;touch-action:none;user-select:none}
#bar{display:flex;gap:6px;padding:8px 12px;align-items:center;flex-wrap:wrap}
.tool{font:inherit;font-size:19px;font-weight:700;min-width:60px;height:52px;border-radius:12px;border:3px solid #999;background:var(--ui);padding:0 9px}

#svg{flex:1;min-width:0}

.tg{position:relative}
.tgh{font:inherit;font-size:19px;font-weight:700;height:52px;border-radius:12px;border:3px solid #999;background:var(--ui);padding:0 12px;white-space:nowrap}
.tg.open .tgh{border-color:#222;background:#fff7cf}
.tgb{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:6;background:#fff;border:3px solid #444;border-radius:16px;padding:10px;gap:8px;flex-wrap:wrap;width:max-content;max-width:min(560px,92vw);box-shadow:0 6px 18px #0003}
.tg.open .tgb{display:flex}

#vis{padding:0;font-size:17px}

.tac h4{margin:4px 0 0;font-size:16px;color:#666}
.tc{font:inherit;text-align:left;border:3px solid #ddd;border-radius:14px;background:#fff;padding:8px 12px;font-size:20px;font-weight:700}
.tc small{display:block;font-size:14px;font-weight:400;color:#555}.tc.on{border-color:#222;background:#fff7cf}

#side h3{margin:4px 0 6px;font-size:18px}

rt{font-size:.5em}

 padding:8px 28px;border-radius:20px;display:none}

/* ===== スマホ（縦持ち、幅700px以下） =====

 .qbar{gap:8px;padding:6px 8px;flex-wrap:wrap}#qq{font-size:18px;flex-basis:100%;order:5}#qno{font-size:15px}#qscore{font-size:17px}
 #qsvg{flex:none;width:100%;aspect-ratio:23/12.4;height:auto}
 .qfoot{flex-wrap:wrap;padding:6px 10px 10px}#qfb{font-size:17px;flex-basis:100%}
 #dlg h2{font-size:21px}.nm,.nm input{font-size:22px}.sv{font-size:18px}
 #cut{font-size:40px}
}
</style></head><body>

  <button class="card" data-go="boardScr"><span class="ic">📋</span>作戦ボード<small>線を 書いて <ruby>動<rt>うご</rt></ruby>きを <ruby>考<rt>かんが</rt></ruby>える</small></button>
  <button class="card" data-go="quiz"><span class="ic">💡</span>はんだん トレーニング<small>どこに パス？ どこへ <ruby>動<rt>うご</rt></ruby>く？</small></button>

<script>
/* ===== データ =====
 groups: 番号ごとの 動きの まとまり（同じ 番号は 同時に 動く）
   move:{type:"move",id,path:[[dx,dy]...]}  … 道の 形（はじめの 位置からの ずれ）。始まりは その時の 位置に 合わせる
   pass:{type:"pass",to,path:[[x,y]...]|null} … 出す人は その時 ボールを 持つ人。null は タップで 決めた まっすぐの パス
 cursor: 次に 書く 動きの 入れ先  {kind:"new",at:k}＝k番めの 前に 新しい 番号 ／ {kind:"join",g:k}＝k番めに 同時で 足す */
const START={bA:[1,5],bB:[12,5],bC:[11,2.2],bD:[11,7.8],bE:[11,5.2],rC:[7,3],rD:[7,5],rE:[7,7]};
const GOALMAN="bA", MID=10;
const COL=id=>id[0]==="b"?"var(--blue)":"var(--red)";
const clone=o=>JSON.parse(JSON.stringify(o));
let st={pieces:clone(START),holder:"bB",groups:[]};
try{const s=localStorage.getItem("pb-mock2"); if(s) st=JSON.parse(s);}catch(e){}
let curName="";
let SHOW={mv:false,ps:false,df:false,num:false,free:true}, HIDE=new Set();
let mode="move", drawing=null, cur=null, playing=false, lastAdded=null;
let cursor=st.groups.length?{kind:"join",g:st.groups.length-1}:{kind:"new",at:0};
const svg=document.getElementById("svg"), NS="http://www.w3.org/2000/svg";
const E=(t,a,p)=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); (p||svg).appendChild(e); return e;};
const HINT={move:"駒から 指で 線を 引くと、その道を 歩く（青い線）。同じ 番号は 同時に 動く。",
 pass:"ボールを 持つ 駒から 線を 引く（赤い 点線）か、受ける 駒を タップ。",
 drag:"駒や ボールを はじめの 場所に 置く。",erase:"線を さわると 消える。"};
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const lerp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];

/* ===== 道の 計算 ===== */
function along(path,f){ let L=0; const seg=[]; for(let i=1;i<path.length;i++){ const d=dist(path[i],path[i-1]); seg.push(d); L+=d; }
  if(!L) return path[0].slice(); let r=f*L;
  for(let i=0;i<seg.length;i++){ if(r<=seg[i]) return lerp(path[i],path[i+1],seg[i]?r/seg[i]:0); r-=seg[i]; } return path[path.length-1].slice(); }
const movePath=(a,p0)=>a.path.map(q=>[p0[0]+q[0],p0[1]+q[1]]);
/* パスの 道：書いた 形を 出す人・受ける人の 今の 位置に 合わせて のばす */
function passPos(a,from,to,u){ if(!a.path) return lerp(from,to,u);
  const P=a.path, q=along(P,u), s=P[0], e=P[P.length-1];
  return [q[0]+(from[0]-s[0])*(1-u)+(to[0]-e[0])*u, q[1]+(from[1]-s[1])*(1-u)+(to[1]-e[1])*u]; }
function passPoly(a,from,to){ const o=[]; for(let i=0;i<=24;i++) o.push(passPos(a,from,to,i/24)); return o; }

/* ===== 守りの 動き：パスの 通り道・受ける人・ゴールマンの 近くを ねらう ===== */
function clampDef(p,holderPos){ let x=Math.min(MID-0.3,Math.max(2.3,p[0])), y=Math.min(9.7,Math.max(0.3,p[1]));
  if(holderPos){ const d=dist([x,y],holderPos); if(d<1.5){ const k=1.5/(d||1); x=holderPos[0]+(x-holderPos[0])*k; y=holderPos[1]+(y-holderPos[1])*k; } }
  return [Math.min(MID-0.3,Math.max(2.3,x)),Math.min(9.7,Math.max(0.3,y))]; }
/* 守りの 動き方（どれも パスの 行き先は 知らない。攻めが 動いた 先を 見て 動く）
   mark …… マーク：1人ずつ 近い 攻めに つく（ゴール側・ボール寄り）
   goal …… ゴールまもり：帯の 前に 3人で ならび、ボールの 方へ ずれる
   lane …… パスコース：ボールの 人と 受けそうな 人の 間に 入る */
const DEFS=[["off","🛡 守り 止まる"],["mark","🛡 マーク"],["goal","🛡 ゴールまもり"],["lane","🛡 パスコース"]];
let defMode="mark";
function defTargets(S,E2,holder){
  const defs=Object.keys(S.p).filter(k=>k[0]==="r"), T={}, free=defs.slice();
  const take=pt=>{ let b=null,bd=1e9; free.forEach(d=>{ const dd=dist(S.p[d],pt); if(dd<bd){bd=dd;b=d;} }); if(b) free.splice(free.indexOf(b),1); return b; };
  const hp=E2[holder]||[MID,5], gm=E2[GOALMAN];
  const atk=Object.keys(E2).filter(k=>k[0]==="b"&&k!==holder&&k!==GOALMAN&&E2[k][0]<MID+1).sort((a,b)=>E2[a][0]-E2[b][0]); // ゴールに 近い 順
  if(defMode==="mark"){
    atk.forEach(k=>{ if(!free.length) return; const a=E2[k], t=[a[0]-1.0,a[1]+(hp[1]-a[1])*.15]; const d=take(t); if(d) T[d]=t; });
    if(gm&&free.length){ const t=[3.0,gm[1]+(hp[1]-gm[1])*.3]; const d=take(t); if(d) T[d]=t; } }
  if(defMode==="goal"){ const c=Math.min(7.5,Math.max(2.5,(gm?gm[1]:5)+(hp[1]-(gm?gm[1]:5))*.35));
    [[3.4,c],[3.8,c-2.4],[3.8,c+2.4]].forEach(t=>{ const d=take(t); if(d) T[d]=t; }); }
  if(defMode==="lane"){ const rc=atk.concat(gm&&holder!==GOALMAN?[GOALMAN]:[]).sort((a,b)=>dist(E2[a],hp)-dist(E2[b],hp));
    rc.forEach(k=>{ if(!free.length) return; const t=lerp(hp,E2[k],.6); const d=take(t); if(d) T[d]=t; }); }
  free.forEach(d=>T[d]=S.p[d]);
  for(const d in T){ let t=T[d]; const s=S.p[d], L=dist(s,t), MAX=3.2; if(L>MAX) t=lerp(s,t,MAX/L); T[d]=clampDef(t,E2[holder]); }
  return T; }

/* ===== 番号ごとの 位置を 順に 計算（始めの 位置の 一覧） ===== */
/* 守りの反応：ふつう＝一手おくれ（その番号が始まる時の攻めの位置を見て動く。走りこみに おくれて マークが外れる）
               はやい＝先読み（攻めが動き終わる場所へ同時に付く。強い守り） */
let defLag=true;
const FREE=1.5;   // 守りから この距離以上 はなれた 攻め＝フリー（パスの チャンス）
function simulate(){ const S=[{p:clone(st.pieces),h:st.holder}];
  st.groups.forEach((g,gi)=>{ const s=S[gi], e={p:clone(s.p),h:s.h};
    g.forEach(a=>{ if(a.type==="move"&&s.p[a.id]){ const P=movePath(a,s.p[a.id]); e.p[a.id]=P[P.length-1]; } });
    const ps=g.find(a=>a.type==="pass"&&a.to!==s.h&&s.p[a.to]);
    if(defMode!=="off"){ const T=defTargets(s,defLag?s.p:e.p,s.h); for(const d in T) e.p[d]=T[d]; }
    if(ps) e.h=ps.to; S.push(e); });
  return S; }
function baseState(S){ return cursor.kind==="new"?S[cursor.at]:S[cursor.g]; }

/* ===== 描く ===== */
function draw(anim){ svg.innerHTML=""; const S=simulate();
  E("rect",{x:0,y:0,width:20,height:10,fill:"#e9d9b4",stroke:"#555","stroke-width":.08});
  E("rect",{x:0,y:0,width:2,height:10,fill:"#f2c86a",opacity:.6}); E("rect",{x:18,y:0,width:2,height:10,fill:"#f2c86a",opacity:.6});
  E("line",{x1:MID,y1:0,x2:MID,y2:10,stroke:"#555","stroke-width":.08});

/* ===== 足す・消す ===== */
const MINPASS=3;   // 近すぎる パスは させない（m）

  if(cursor.kind==="join"){ const g=st.groups[cursor.g];
    if(a.type==="pass"&&g.some(x=>x.type==="pass")) return hint("1つの 番号に パスは 1つだけ。");
    if(a.type==="move"){ const i=g.findIndex(x=>x.type==="move"&&x.id===a.id); if(i>=0) g.splice(i,1); }
    g.push(a); lastAdded=cursor.g; }
  else { HIDE=new Set([...HIDE].map(x=>x>=cursor.at?x+1:x)); st.groups.splice(cursor.at,0,[a]); lastAdded=cursor.at; cursor={kind:"join",g:cursor.at}; }
  hint((cursor.g+1)+" 番に 足した。同じ 番号は 同時に 動く。次の 番号は ➕。"+(SHOW[a.type==="move"?"mv":"ps"]?"":"（線は 👀 見る で 出せる）")); }
function removeAct(gi,ai){ const shift=()=>{ HIDE=new Set([...HIDE].filter(x=>x!==gi).map(x=>x>gi?x-1:x)); }; st.groups[gi].splice(ai,1); if(!st.groups[gi].length){ st.groups.splice(gi,1); shift();
    if(cursor.kind==="join") cursor={kind:"new",at:Math.min(gi,st.groups.length)}; else if(cursor.at>gi) cursor.at--; }

svg.addEventListener("pointerdown",ev=>{ if(playing) return; svg.setPointerCapture(ev.pointerId); const p=pt(ev);
  if(mode==="erase"){ const g=ev.target.closest("g[data-g]"); if(g) removeAct(+g.dataset.g,+g.dataset.a); return; }
  if(mode==="drag"){ const id=ev.target.dataset.id; if(id) drawing={drag:id}; return; }
  const B=baseState(simulate()), id=near(p,B.p); if(!id) return;
  if(mode==="move"){ if(id[0]==="r"&&defMode!=="off") return hint("守りは 自動で 動く。手で 動かす ときは 🛡 を「止まる」に。");
    cur={type:"move",id,path:[B.p[id].slice()]}; drawing=cur; return; }
  if(id===B.h){ cur={type:"pass",path:[B.p[id].slice()]}; drawing=cur; }      // ボールを 持つ 人から 引く
  else drawing={tap:id};                                                        // 受ける 人の タップ
});
svg.addEventListener("pointermove",ev=>{ if(!drawing) return; const p=pt(ev);
  if(drawing.drag){ if(drawing.drag==="ball"){ const id=near(p,st.pieces,1); if(id) st.holder=id; } else st.pieces[drawing.drag]=p; draw(); return; }
  if(!cur) return; const l=cur.path[cur.path.length-1]; if(dist(p,l)>.25){ cur.path.push(p); draw(); } });

  if(drawing.tap){ if(B.h&&B.h[0]===drawing.tap[0]) addAct({type:"pass",to:drawing.tap,path:null}); else hint("パスは 同じ チームの 人へ。"); }
  else if(cur&&cur.type==="move"&&cur.path.length>2){ const o=cur.path[0]; addAct({type:"move",id:cur.id,path:cur.path.map(q=>[q[0]-o[0],q[1]-o[1]])}); }

  QE("line",{x1:MID,y1:0,x2:MID,y2:10,stroke:"#555","stroke-width":.08}); }
function piecesQ(q){ for(const id in q.p){ const [x,y]=q.p[id];
    if(q.type==="move"&&id===q.me) QE("circle",{cx:x,cy:y,r:.75,fill:"none",stroke:"#ffd84d","stroke-width":.2});
    QE("circle",{cx:x,cy:y,r:.45,fill:COL(id),stroke:id===GOALMAN?"#f2a400":"#fff","stroke-width":id===GOALMAN?.14:.08,"data-id":id});
    const t=QE("text",{x,y:y+.17,"font-size":.5,"text-anchor":"middle",fill:"#fff","font-weight":700,"pointer-events":"none"}); t.textContent=id[1]; }
  const H=q.p[q.h]; QE("circle",{cx:H[0]+.45,cy:H[1]-.45,r:.25,fill:"#fff",stroke:"#222","stroke-width":.06}); }
function showQ(){ const q=QS[qi]; answered=false; courtQ(); piecesQ(q);
  document.getElementById("qno").textContent=(qi+1)+" / "+QS.length;
  document.getElementById("qq").innerHTML=ruby(q.type==="pass"?q.h[1]+" が ボールを {持|も}って いる。どこに パス？":"あなたは "+q.me[1]+"。"+q.h[1]+" から パスを もらうには、どこへ {動|うご}く？");
  document.getElementById("qscore").textContent="○ "+qok;
  document.getElementById("qfb").innerHTML=ruby(q.type==="pass"?"パスする {味方|みかた}を タップ。":"{動|うご}く {場所|ばしょ}を タップ。");
  document.getElementById("qnext").style.visibility="hidden"; }
function arrowQ(F,T,c,dash){ QE("line",{x1:F[0],y1:F[1],x2:T[0],y2:T[1],stroke:c,"stroke-width":.14,"stroke-dasharray":dash?".35 .25":"none","stroke-linecap":"round"}); }
function markQ(P,r,big){ QE("circle",{cx:P[0],cy:P[1]-(big?0:.95),r:big?.55:.4,fill:RC[r]}); const t=QE("text",{x:P[0],y:P[1]-(big?0:.95)+.17,"font-size":big?.6:.5,"text-anchor":"middle",fill:"#fff","font-weight":700}); t.textContent=RM[r]; }
qsvg.addEventListener("pointerdown",ev=>{ if(answered) return; const q=QS[qi];
  const pp=qsvg.createSVGPoint(); pp.x=ev.clientX; pp.y=ev.clientY; const c=pp.matrixTransform(qsvg.getScreenCTM().inverse()), P=[c.x,c.y];
  const H=q.p[q.h], fb=document.getElementById("qfb"); let r, why;
  if(q.type==="pass"){ let to=null,bd=.9; for(const id in q.p) if(id[0]==="b"&&id!==q.h&&dist(q.p[id],P)<bd){bd=dist(q.p[id],P);to=id;}
    if(!to) return; answered=true; courtQ();
    // すべての パス先を 色で 見せる
    for(const id in q.p) if(id[0]==="b"&&id!==q.h){ arrowQ(H,q.p[id],RC[passRate(q,id)],true); }
    piecesQ(q); for(const id in q.p) if(id[0]==="b"&&id!==q.h) markQ(q.p[id],passRate(q,id));
    QE("circle",{cx:q.p[to][0],cy:q.p[to][1],r:.8,fill:"none",stroke:"#222","stroke-width":.14});
    r=passRate(q,to);
    if(r==="t"&&isBack(q,to)){ why=to[1]+" へは {通|とお}る。でも うしろへ もどる パス。{前|まえ}に いる {味方|みかた}は？"; }
    else why=to[1]+" へ："+(r==="o"?(to===GOALMAN?"ゴールマンへの {道|みち}が あいて いる！":"パスの {道|みち}に {守|まも}りが いない！"):r==="t"?"{守|まも}りの {近|ちか}くを {通|とお}る。あぶない。":"{守|まも}りが {道|みち}に いる。カットされる。");
  } else { answered=true; const J=moveJudge(q,P); r=J.r; why=J.why; courtQ();
    // よい 場所を 緑の 点で 見せる
    for(let x=.25;x<20;x+=.5) for(let y=.25;y<10;y+=.5) if(moveJudge(q,[x,y]).r==="o") QE("circle",{cx:x,cy:y,r:.12,fill:RC.o,opacity:.55});
    QE("line",{x1:q.p[q.me][0],y1:q.p[q.me][1],x2:P[0],y2:P[1],stroke:"var(--mv)","stroke-width":.12,"stroke-dasharray":".2 .15"});
    arrowQ(H,P,RC[r],true); piecesQ(q); markQ(P,r,true); }
  if(r==="o") qok++;
  fb.innerHTML=`<span style="color:${RC[r]}">${RM[r]}</span> `+ruby(why)+(q.type==="move"?ruby("<br><small style='font-size:18px;color:#555'>{緑|みどり}の 点＝よい {場所|ばしょ}</small>"):"");
  document.getElementById("qscore").textContent="○ "+qok;
  const nx=document.getElementById("qnext"); nx.style.visibility="visible"; nx.textContent=qi<QS.length-1?"つぎへ ▶":"おわり"; });
document.getElementById("qnext").onclick=()=>{ if(qi<QS.length-1){ qi++; showQ(); }
  else { courtQ(); document.getElementById("qq").textContent="おしまい！"; document.getElementById("qfb").innerHTML="○ は "+qok+" / "+QS.length+"。もう {一度|いちど} やる？".replace(/\{([^|}]+)\|([^}]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>");
    const nx=document.getElementById("qnext"); nx.textContent="もう 一度"; nx.onclick=()=>{ nx.onclick=null; location.hash=""; startQuiz(); bindNext(); }; } };
function bindNext(){ document.getElementById("qnext").onclick=arguments.callee.orig; }
bindNext.orig=document.getElementById("qnext").onclick;
go("home");
</script>
