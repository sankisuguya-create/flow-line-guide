<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- このファイルは tools/build.mjs が作る。直接直さず plans/ と spaces/ と core/ を直す -->
<title>4年 すいえい 1回目</title>
<style>
:root{
    --paper:#EEF3F7; --grid:#C7DAE7; --grid-strong:#A9C6D9;
    --ink:#143242; --ink-soft:#4B6C80; --marker:#F0912B; --marker-soft:#FBD9AE;
    --water:#BFE0F5; --deck:#F6F1E4; --bldg:#E3E0D6; --me:#0B5CAD; --warn:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;min-height:540px;overflow:hidden}
  body{
    font-family:"Hiragino Sans","Yu Gothic UI","BIZ UDPGothic","Noto Sans JP",sans-serif;
    color:var(--ink); background-color:var(--paper);
    background-image:
      repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(to right, var(--grid-strong) 0 1px, transparent 1px 110px),
      repeating-linear-gradient(to bottom, var(--grid-strong) 0 1px, transparent 1px 110px);
    line-height:1.5;
  }
  .app{position:relative;display:flex;height:100%;min-height:540px}
  .side{flex:0 0 236px;width:236px;height:100%;overflow-y:auto;background:#F7FAFC;
        border-right:2px solid var(--ink);padding:14px 12px 20px;transition:margin-left .22s ease}
  .app.closed .side{margin-left:-236px}
  .float{position:absolute;top:12px;left:248px;z-index:20;display:flex;flex-direction:column;gap:8px;width:48px;transition:left .22s ease}
  .app.closed .float{left:12px}
  .float button{width:48px;height:48px;padding:0;border-radius:12px;display:grid;place-items:center;font-size:18px;text-align:center}
  .stagearea{flex:1;min-width:0;height:100%;padding:4px 4px 4px 64px;display:flex;flex-direction:column}
  svg.field{flex:1;min-height:0;width:100%;display:block}
  h1{font-size:16px;font-weight:900;margin:64px 0 14px;line-height:1.4;display:inline-block;
     background:linear-gradient(transparent 62%, var(--marker-soft) 62% 94%, transparent 94%);padding:0 .1em}
  .grp{margin-bottom:14px}
  .lab{display:block;font-size:12px;font-weight:800;color:var(--ink-soft);letter-spacing:.08em;margin:0 0 6px}
  button{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);
         border-radius:10px;padding:9px 12px;cursor:pointer;line-height:1.2;width:100%;text-align:left;touch-action:manipulation}
  button:hover{background:var(--marker-soft)}
  button:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
  button[aria-pressed="true"]{background:var(--marker);border-color:var(--marker)}
  .seg{display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
  .seg button{border:none;border-radius:0;border-top:2px solid var(--ink)}
  .seg button:first-child{border-top:none}
  .seg.row{flex-direction:row;flex-wrap:wrap}
  .seg.row button{flex:1 1 30%;text-align:center;border-top:none;border-left:2px solid var(--ink);padding:9px 0}
  .seg.row button:first-child{border-left:none}
  .seg.row button.wide{flex-basis:100%;border-left:none;border-bottom:2px solid var(--ink)}
  .chap button{font-size:13px;padding:6px 10px;font-weight:600}
  .chap button span{display:inline-block;width:3.2em;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .chap button.now{background:var(--marker-soft)}
  input[type=range]{width:100%;accent-color:var(--marker)}

  /* いま なにを しているか（図の上の帯） */
  .cap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 10px;margin:4px 0;
       background:#fff;border:2px solid var(--ink);border-radius:12px;min-height:56px}
  .cap .clock{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--me)}
  .cap .who{font-size:14px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px}
  .cap .say{font-size:20px;font-weight:800}
  .cap .chip{font-size:14px;font-weight:700;border:2px solid var(--ink-soft);border-radius:999px;padding:0 10px;background:#fff}
  .cap .chip.mine{border-color:var(--me);background:#E3EEFA}
  .cap .chip.warn{border-color:var(--warn);color:var(--warn)}
  rt{font-size:.5em}

  /* 図 */
  .lbl{font-size:18px;font-weight:800;fill:var(--ink-soft);text-anchor:middle;dominant-baseline:middle}
  .lbl.s{font-size:14px;font-weight:600}
  .zone{stroke:#8E9AA3;stroke-width:2}
  .g .kid{stroke:var(--ink);stroke-width:1.2}
  .g .tag{fill:#fff;stroke:var(--ink);stroke-width:2}
  .g.watch .kid{fill:#fff!important;stroke-dasharray:2 1.5}
  .g.me .tag{fill:var(--ink)}
  .g.me .kid{stroke-width:2}
  .g text{font-size:14px;font-weight:900;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
  .g.watch rect{stroke-dasharray:5 3}
  .g.dim{opacity:.22}
  .g.me rect{fill:var(--me);stroke:var(--me)}
  .g.me text{fill:#fff}
  .trail{fill:none;stroke:var(--me);stroke-width:3;stroke-dasharray:3 7;stroke-linecap:round;opacity:.65}
  .trail.go{stroke-width:7;stroke-dasharray:none;opacity:1}
  .oneway{fill:none;stroke:#A8A08A;stroke-width:3;stroke-dasharray:10 8}

  @media (max-height:540px){ html,body,.app{min-height:0} .cap{min-height:0;padding:2px 8px} .cap .chip{display:none} .float button{width:42px;height:42px} .float{gap:6px} }
  @media (max-width:760px){
    .side{position:absolute;z-index:15;left:0;top:0;box-shadow:4px 0 12px rgba(0,0,0,.15)}
    .stagearea{padding-left:64px}
    .cap .say{font-size:17px} .cap .clock{font-size:22px}
  }
  /* 場の描きわけ（space.json の kind） */
  .a-deck{fill:var(--deck)} .a-water{fill:var(--water)} .a-room{fill:var(--bldg)} .a-box{fill:#fff}
  .lbl.water{fill:#0B4F86}
  .pl{font-size:12px;font-weight:600;fill:var(--ink-soft);text-anchor:middle}
  .kari{font-size:13px;font-weight:800;fill:var(--warn)}
  .sig rect{fill:#fff;stroke:var(--warn);stroke-width:3}
  .sig text{font-size:20px;font-weight:800;fill:var(--warn);text-anchor:middle;dominant-baseline:middle}
  .mk{fill:rgba(255,255,255,.55);stroke:#8E9AA3;stroke-width:2;stroke-dasharray:6 5}
  .tread{stroke:#8E9AA3;stroke-width:1.5}
  .stair-ar{stroke:var(--ink-soft);stroke-width:3}
  .wall{stroke:#8E9AA3;stroke-width:5;stroke-linecap:square}
  .jamb{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
  .a-stairs{fill:#fff}
  .zwall{stroke:#8E9AA3;stroke-width:2;stroke-linecap:square}

</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <h1 id="h1"></h1>
    <div class="grp">
      <span class="lab">だれを 見る？</span>
      <span class="seg row" id="who"></span>
    </div>
    <div class="grp">
      <span class="lab">じかん</span>
      <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="じかん">
    </div>
    <div class="grp">
      <span class="lab">はやさ</span>
      <span class="seg row" id="speeds">
        <button data-r="0.5">×0.5</button><button data-r="1" aria-pressed="true">×1</button><button data-r="2">×2</button>
      </span>
    </div>
    <div class="grp">
      <span class="lab">とぶ</span>
      <div class="seg chap" id="chap"></div>
    </div>
  </aside>
  <div class="float">
    <button id="toggle" aria-label="そうさパネル">&#9776;</button>
    <button id="play" aria-label="さいせい／ていし"></button>
    <button id="ff" aria-label="はやおくり">&#9654;&#9654;</button>
    <button id="rew" aria-label="まきもどし">&#9664;&#9664;</button>
  </div>
  <main class="stagearea">
    <div class="cap" id="cap" aria-live="polite"></div>
    <svg class="field" id="svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="うごきの 図"></svg>
  </main>
</div>

    var p0={left:[x+w*(1-m),cy],right:[x+w*m,cy],up:[cx,y+h*(1-m)],down:[cx,y+h*m]}[a.up];
    var p1={left:[x+w*m,cy],right:[x+w*(1-m),cy],up:[cx,y+h*m],down:[cx,y+h*(1-m)]}[a.up];
    if(a.to) LABELS+='<text class="lbl s stair-to" x="'+(hor?(a.up==="right"?x+w*0.2:x+w*0.8):x+w/2)+'" y="'+(y+h/2)+'" style="fill:#fff">'+a.to+'</text>';
    return;
  }
  if(!a.label) return;
  if(a.kind==="deck") LABELS+='<text class="lbl s" x="'+(x+w-10)+'" y="'+(y+h-14)+'" style="text-anchor:end">'+a.label+'</text>';
  else if(h>w*2&&w<100) LABELS+='<text class="lbl s" x="'+(x+w/2)+'" y="'+(y+14)+'">'+a.label+'</text>';
  else if(h<w*1.6&&h<60) LABELS+='<text class="lbl s" x="'+(x+w/2)+'" y="'+(y+h/2)+'">'+a.label+'</text>';
  else LABELS+='<text class="lbl'+(a.kind==="water"?" water":(a.kind==="box"||a.kind==="mark"?" s":""))+'" x="'+(x+w/2)+'" y="'+(y+18)+'">'+a.label+'</text>'+
    (a.sub?'<text class="lbl s" x="'+(x+w/2)+'" y="'+(y+h-14)+'">'+a.sub+'</text>':'');
});
(SP.walls||[]).forEach(function(wl){ BASE+='<line class="wall" x1="'+r(wl[0][0])+'" y1="'+r(wl[0][1])+'" x2="'+r(wl[1][0])+'" y2="'+r(wl[1][1])+'"/>'; });
(SP.doors||[]).forEach(function(d){
  // 壁の上の a→b の区間を、手前の場所の塗りで消して 切れ目にする。扉なら 両端に 壁と直交する枠
  var a=[r(d.from[0]),r(d.from[1])], b=[r(d.to[0]),r(d.to[1])], v=(a[0]===b[0]), k=0.35*S;
  BASE+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+(FILL[d.fill]||"#fff")+'" stroke-width="6"/>';
  if(d.kind!=="open") [a,b].forEach(function(p){
    BASE+= v?'<line class="jamb" x1="'+(p[0]-k)+'" x2="'+(p[0]+k)+'" y1="'+p[1]+'" y2="'+p[1]+'"/>'
            :'<line class="jamb" y1="'+(p[1]-k)+'" y2="'+(p[1]+k)+'" x1="'+p[0]+'" x2="'+p[0]+'"/>'; });
  if(d.label) LABELS+='<text class="lbl s door-l" x="'+((a[0]+b[0])/2+(v?14:0))+'" y="'+((a[1]+b[1])/2+(v?0:-10))+'" style="text-anchor:'+(v?"start":"middle")+'">'+d.label+'</text>';
});
BASE=BASE.replace("</defs>",'<marker id="as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ink-soft)"/></marker></defs>');
(SP.marks||[]).forEach(function(m){
  if(m.kind!=="oneway") return;
  var pts=m.pts.map(function(p){return r(p[0])+" "+r(p[1]);});
  BASE+='<path class="oneway" d="M'+pts.join("L")+'" marker-end="url(#ar)"/>';
  var q=m.pts[Math.floor(m.pts.length/2)];
  BASE+='<text class="lbl s" x="'+(r(q[0])+12)+'" y="'+r(q[1])+'" style="text-anchor:start">'+m.label+'</text>';
});
Object.keys(SP.pointLabels||{}).forEach(function(k){
  var p=SP.pointLabels[k]; BASE+='<text class="pl" x="'+r(p.at[0])+'" y="'+(r(p.at[1])+(p.at[1]>SP.size[1]/2?34:-24))+'">'+p.text+'</text>';
});
BASE+=LABELS;
if(SP.up) BASE+='<text class="lbl s" x="'+(SP.size[0]*S-8)+'" y="18" style="text-anchor:end">▲ '+SP.up+'</text>';
if(SP.status!=="確認済") BASE+='<text class="kari" x="8" y="'+(SP.size[1]*S-8)+'">※ 仮の地図（じっさいの配置と ちがうことがあります）</text>';

/* ===== うごき ===== */
var G=PL.groups;
function posAt(g,t){
  var K=g.keys,i;
  if(t<=K[0][0]) return {x:K[0][1],y:K[0][2],seg:-1,i:0,u:0};
  for(i=0;i<K.length-1;i++){
    if(t<K[i+1][0]){
      var a=K[i],b=K[i+1],u=(t-a[0])/(b[0]-a[0]), mv=(a[1]!==b[1]||a[2]!==b[2]||b[4]===1);
      return {x:a[1]+(b[1]-a[1])*u, y:a[2]+(b[2]-a[2])*u, seg:mv?i:-1, i:i, u:u};
    }
  }
  i=K.length-1; return {x:K[i][1],y:K[i][2],seg:-1,i:i,u:0};
}
// 組の描き方：児童ひとりずつの点。隊形（g.forms）がある間は その位置、移動中は 8列のかたまり。
// 隊形が変わる区間（key[4]=1）は ひとりずつ動かし、1列目（プール側）から先に動く。点の大きさ＝背の高さ（g.rad）。
function slotsOf(g,key){
  if(key[3]&&g.forms[key[3]]) return g.forms[key[3]];
  var cols=8, rws=Math.ceil(g.n/cols), d=0.45, out=[];
  for(var j=0;j<g.n;j++) out.push([key[1]+((j%cols)-(cols-1)/2)*d, key[2]+(Math.floor(j/cols)-(rws-1)/2)*d]);
  return out;
}
function kidsAt(g,t){
  var p=posAt(g,t), K=g.keys, a=K[p.i], b=K[p.i+1];
  if(p.seg<0||!b) return slotsOf(g,{1:p.x,2:p.y,3:(p.seg<0?a[3]:null)});
  if(b[4]===1){ var A=slotsOf(g,a), B=slotsOf(g,b), out=[];
    for(var j=0;j<g.n;j++){ var row=Math.floor(j/g.per), u=Math.max(0,Math.min(1,(p.u-row*0.45)/0.55)); u=u*u*(3-2*u);
      out.push([A[j][0]+(B[j][0]-A[j][0])*u, A[j][1]+(B[j][1]-A[j][1])*u]); }
    return out; }
  return slotsOf(g,{1:p.x,2:p.y,3:null});
}
function groupSvg(g,t){
  var ks=kidsAt(g,t), out="", minY=1e9, sx=0;
  for(var j=0;j<ks.length;j++){ var q=ks[j];
    out+='<circle class="kid" cx="'+r(q[0])+'" cy="'+r(q[1])+'" r="'+(g.rad[j]*S).toFixed(1)+'" style="fill:'+(g.color||"#fff")+'"/>';
    if(q[1]<minY) minY=q[1]; sx+=q[0]; }
  var tx=r(sx/ks.length), ty=r(minY)-14;
  return out+'<rect class="tag" x="'+(tx-22)+'" y="'+(ty-11)+'" width="44" height="22" rx="11"/><text x="'+tx+'" y="'+ty+'">'+g.label+'</text>';
}
function anyMoving(t){ for(var i=0;i<G.length;i++) if(posAt(G[i],t).seg>=0) return true; return false; }
function phaseIdx(t){ var k=0; PL.phases.forEach(function(p,i){ if(t>=p.at) k=i; }); return k; }
function clockStr(t){ var m=Math.floor(t+1e-6); return Math.floor(m/60)+":"+("0"+(m%60)).slice(-2); }
function fill(s,v){ return String(s).replace(/\{(\w+)\}/g,function(_,k){ return v&&v[k]!==undefined?v[k]:""; }); }

var who=load("who","all"), clock=T0, paused=true, rate=1, hold=0;
if(who!=="all"&&!G.some(function(g){return g.id===who;})) who="all";

function draw(){
  var s=BASE, sel=null;
  G.forEach(function(g){ if(g.id===who) sel=g; });
  var pi=phaseIdx(clock), ph=PL.phases[pi], nx=PL.phases[pi+1];
  if(sel){
    // いまの場面の あいだに 通る道（点線）と、いま 動いている区間（太線）
    var tA=ph.at, tB=nx?nx.at:T1+1, st=posAt(sel,tA), pts=[[st.x,st.y]];
    sel.keys.forEach(function(k){ if(k[0]<=tA||k[0]>tB) return; var l=pts[pts.length-1]; if(l[0]!==k[1]||l[1]!==k[2]) pts.push([k[1],k[2]]); });
    if(pts.length>1) s+='<path class="trail" marker-end="url(#am)" d="M'+pts.map(function(p){return r(p[0])+" "+r(p[1]);}).join("L")+'"/>';
    var now=posAt(sel,clock);
    if(now.seg>=0){ var a=sel.keys[now.seg], b=sel.keys[now.seg+1];
      s+='<path class="trail go" d="M'+r(a[1])+" "+r(a[2])+"L"+r(b[1])+" "+r(b[2])+'" marker-end="url(#am)"/>'; }
  }
  (PL.signals||[]).forEach(function(b){ if(clock>=b.at-1&&clock<b.at+1.5){
    var cx=SP.size[0]*S*0.62;
    s+='<g class="sig"><rect x="'+(cx-200)+'" y="6" width="400" height="44" rx="10"/><text x="'+cx+'" y="29">'+b.text+'</text></g>'; } });
  var order=G.filter(function(g){return g!==sel;}); if(sel) order.push(sel);
  order.forEach(function(g){
    var p=posAt(g,clock), cls="g"+(g.style==="watch"?" watch":"")+(sel?(g===sel?" me":" dim"):"");
    s+='<g class="'+cls+'">'+groupSvg(g,clock)+'</g>';
  });
  svg.innerHTML=s;

  // 帯：選んだ組の ことばに 差しかえる
  var w=ph, v=sel?sel.vars:null;
  if(sel&&ph.by&&ph.by[sel.id]) w=Object.assign({},ph,ph.by[sel.id],{mine:null});
  var chips=[];
  if(sel&&w.mine) chips.push('<span class="chip mine">'+fill(w.mine,v)+'</span>');
  (w.chips||[]).forEach(function(c){ chips.push('<span class="chip">'+fill(c,v)+'</span>'); });
  if(w.warn) chips.push('<span class="chip warn">⚠ '+w.warn+'</span>');
  cap.innerHTML='<span class="clock">'+clockStr(clock)+'</span><span class="who">'+(sel?sel.label:"ぜんぶ")+'</span><span class="say">'+fill(w.say,v)+'</span>'+chips.join("");
  Array.prototype.forEach.call($("chap").children,function(b,i){ b.classList.toggle("now",i===pi); });
  scrub.value=Math.round((clock-T0)/(T1-T0)*1000);
}

/* ===== 再生 =====
   動いている間は 実時間の 約10倍（1分＝6びょう）。だれも 動かない間は 1分＝0.3びょう で 飛ばす */
var last=null;
function frame(now){
  if(last!==null&&!paused){
    var dt=Math.min(0.1,(now-last)/1000), dir=hold||1, sp=(hold?4:1)*rate*(anyMoving(clock)?1/6:1/0.3);
    clock+=dir*dt*sp;
    if(clock>=T1){clock=T1;if(!hold){paused=true;setPlayIcon();}}
    if(clock<=T0){clock=T0;if(hold<0){hold=0;paused=true;setPlayIcon();}}
    draw();
  }
  last=now; requestAnimationFrame(frame);
}
var playBtn=$("play");
var ICON_PLAY='<svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 2L16 9L4 16z" fill="currentColor"/></svg>';
var ICON_PAUSE='<svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" fill="currentColor"/><rect x="11" y="2" width="4" height="14" fill="currentColor"/></svg>';
function setPlayIcon(){ playBtn.innerHTML=paused?ICON_PLAY:ICON_PAUSE; }
playBtn.onclick=function(){ if(clock>=T1) clock=T0; paused=!paused; setPlayIcon(); };
function holdBtn(id,d){
  var b=$(id), was;
  b.addEventListener("pointerdown",function(e){ e.preventDefault(); was=paused; paused=false; hold=d; });
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ b.addEventListener(ev,function(){ if(hold){ hold=0; paused=was; setPlayIcon(); } }); });
}
holdBtn("ff",1); holdBtn("rew",-1);
scrub.addEventListener("input",function(){ paused=true; setPlayIcon(); clock=T0+(T1-T0)*scrub.value/1000; draw(); });
$("toggle").onclick=function(){ $("app").classList.toggle("closed"); };
$("speeds").onclick=function(e){ var b=e.target.closest("button"); if(!b) return;
  rate=+b.dataset.r; Array.prototype.forEach.call(this.children,function(x){x.setAttribute("aria-pressed",x===b);}); };
$("chap").innerHTML=PL.phases.map(function(p,i){ return '<button data-i="'+i+'"><span>'+clockStr(p.at)+'</span>'+fill(p.say,{})+'</button>'; }).join("");
$("chap").onclick=function(e){ var b=e.target.closest("button"); if(!b) return; clock=PL.phases[+b.dataset.i].at; paused=false; setPlayIcon(); draw(); };
var whoEl=$("who");
whoEl.innerHTML='<button data-w="all" class="wide">ぜんぶ</button>'+G.map(function(g){return '<button data-w="'+g.id+'">'+g.label+'</button>';}).join("");
function setWho(w){ who=w; save("who",w); Array.prototype.forEach.call(whoEl.children,function(x){x.setAttribute("aria-pressed",x.dataset.w===w);}); draw(); }
whoEl.onclick=function(e){ var b=e.target.closest("button"); if(b) setWho(b.dataset.w); };
document.addEventListener("keydown",function(e){
  if(e.key===" "){ e.preventDefault(); playBtn.click(); }
  if(e.key==="ArrowRight"){ clock=Math.min(T1,clock+1); draw(); }
  if(e.key==="ArrowLeft"){ clock=Math.max(T0,clock-1); draw(); }
});
function load(k,d){ try{ var v=localStorage.getItem(PL.key+"."+k); return v===null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(PL.key+"."+k,v); }catch(e){} }
if(window.innerWidth<760||window.innerHeight<500) $("app").classList.add("closed");
setPlayIcon(); setWho(who); requestAnimationFrame(frame);
})();

</script>
</body>
</html>
