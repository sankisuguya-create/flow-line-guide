<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跳び箱の図（試作）</title>
<!-- 体育館の用具の図の試作。1つの立体（実寸mm）から 見方だけを変えて描く。
     地図用は「床の形は真上のまま、高さだけ画面の上へ立ち上げる」描き方（プラノメトリック）。床の位置・向き・寸法は地図と一致する。 -->
<style>
  :root{--ink:#143242;--soft:#4B6C80;--bg:#F7FAFC;--line:#C7DAE7}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic UI","BIZ UDPGothic","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px;border-bottom:2px solid var(--ink);background:#fff}
  h1{font-size:18px;margin:0}
  label{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  input[type=range]{width:160px}
  .note{font-size:12px;color:var(--soft)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:12px 16px}
  figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
  figcaption{font-weight:800;font-size:14px}
  figcaption small{display:block;font-weight:400;color:var(--soft);font-size:12px}
  svg{width:100%;height:260px;display:block}
  .floor{fill:#EEF3F7}
  .grid-l{stroke:#D6E2EA;stroke-width:1}
  .foot{fill:none;stroke:#0B5CAD;stroke-width:1.5;stroke-dasharray:5 4}
</style>
</head>
<body>
<header>
  <h1>跳び箱の図（試作）</h1>
  <label>段数 <input type="range" id="dan" min="1" max="8" value="8"><span id="danV">8</span>段</label>
  <span class="note">寸法は仮（小型8段：上面700×300、底面900×640、高さ1000mm）。1段目の上に白いクッション。</span>
</header>
<div class="grid" id="views"></div>
<script>
(function(){
"use strict";
/* ===== 立体（mm）。X＝幅（短い辺）、Y＝長さ（助走の向き。+Y が助走してくる側）、Z＝高さ ===== */
var SPEC={ top:{L:700,W:300}, bottom:{L:900,W:640}, h1:300, hn:100, pad:50, tiers:8 };
var WOOD="#C98A4B", PAD="#F4EFE2", SLIT="#3A2A1C";

function boxMesh(dan){
  // 下の段から積む。8段のうち 下から (8-dan) 段を取り除いた形＝上から dan 段
  var T=SPEC.tiers, Htot=SPEC.h1+SPEC.hn*(T-1);
  function dims(z){ var u=z/Htot; return {L:SPEC.bottom.L+(SPEC.top.L-SPEC.bottom.L)*u, W:SPEC.bottom.W+(SPEC.top.W-SPEC.bottom.W)*u}; }
  var levels=[]; // 各段の [z下, z上, 番号]
  var z=0;
  for(var k=T;k>=1;k--){ var h=(k===1?SPEC.h1:SPEC.hn); levels.push([z,z+h,k]); z+=h; }
  var use=levels.slice(T-dan);                  // 上から dan 段
  var z0=use[0][0], faces=[];
  use.forEach(function(lv){
    var a=lv[0]-z0, b=lv[1]-z0, d0=dims(lv[0]), d1=dims(lv[1]);
    if(lv[2]===1){ var pz=b-SPEC.pad; addFrustum(faces,a,pz,d0,dims(lv[1]-SPEC.pad),WOOD,lv[2],true,false,"top");
      addFrustum(faces,pz,b,dims(lv[1]-SPEC.pad),d1,PAD,null,false,true,"bottom"); }
    else addFrustum(faces,a,b,d0,d1,WOOD,lv[2],true);
  });
  return {faces:faces, foot:dims(z0), H:z-z0};
}
function addFrustum(F,za,zb,d0,d1,col,num,slit,cap,sharp){   // sharp：丸めない辺（白いクッションと1段目の境目）
  var a=[[-d0.W/2,-d0.L/2,za],[d0.W/2,-d0.L/2,za],[d0.W/2,d0.L/2,za],[-d0.W/2,d0.L/2,za]];
  var b=[[-d1.W/2,-d1.L/2,zb],[d1.W/2,-d1.L/2,zb],[d1.W/2,d1.L/2,zb],[-d1.W/2,d1.L/2,zb]];
  for(var i=0;i<4;i++){ var j=(i+1)%4;
    F.push({p:[a[i],a[j],b[j],b[i]],col:col,num:(i===2?num:null),slit:slit,side:i,h:zb-za,sharp:sharp==='top'?[2,3]:sharp==='bottom'?[0,1]:[]}); }   // i=2：+Y 側（助走側の面）に番号
  F.push({p:[b[0],b[1],b[2],b[3]],col:cap?PAD:col,top:true});
}

/* ===== 見方 ===== */
// 正射影：方位 az（0＝+Y から見る）、仰角 el
function ortho(az,el){ az*=Math.PI/180; el*=Math.PI/180;
  var v=[Math.cos(el)*Math.sin(az),Math.cos(el)*Math.cos(az),Math.sin(el)], r=[Math.cos(az),-Math.sin(az),0],
      u=[-Math.sin(el)*Math.sin(az),-Math.sin(el)*Math.cos(az),Math.cos(el)];
  return {v:v, P:function(p){ return [p[0]*r[0]+p[1]*r[1]+p[2]*r[2], -(p[0]*u[0]+p[1]*u[1]+p[2]*u[2])]; }}; }
// 地図用（プラノメトリック）：床は真上のまま（画面の下＝+Y）、高さ Z は画面の上へ k 倍
function plan(k,rot){ var c=rot?0:1, s=rot?-1:0;   // rot：長い辺を左右に（横向きに置く）
  return {v:[0,k,1], P:function(p){ var x=c*p[0]-s*p[1], y=s*p[0]+c*p[1]; return [x, y-k*p[2]]; }, rot:rot}; }

function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }
// 角を少しだけ丸めた 多角形のパス（角から 辺の長さの18%まで・最大 r で 曲げる）
function rpath(q,r,sharp){ var n=q.length, d=""; sharp=sharp||[];
  for(var i=0;i<n;i++){ var p=q[i], a=q[(i-1+n)%n], b=q[(i+1)%n];
    var la=Math.hypot(a[0]-p[0],a[1]-p[1]), lb=Math.hypot(b[0]-p[0],b[1]-p[1]), k=sharp.indexOf(i)>=0?0:Math.min(r,la*0.18,lb*0.18);
    var s1=[p[0]+(a[0]-p[0])*k/(la||1), p[1]+(a[1]-p[1])*k/(la||1)], s2=[p[0]+(b[0]-p[0])*k/(lb||1), p[1]+(b[1]-p[1])*k/(lb||1)];
    d+=(i?"L":"M")+s1[0].toFixed(1)+" "+s1[1].toFixed(1)+"Q"+p[0].toFixed(1)+" "+p[1].toFixed(1)+" "+s2[0].toFixed(1)+" "+s2[1].toFixed(1); }
  return d+"Z"; }
function shade(hex,f){ var n=parseInt(hex.slice(1),16), r=n>>16, g=n>>8&255, b=n&255;
  return "rgb("+[r,g,b].map(function(c){return Math.round(Math.min(255,c*f));}).join(",")+")"; }

function draw(mesh,view,o){
  // 見えている面だけを、奥から手前へ描く
  var pr=view.P, vis=[];
  mesh.faces.forEach(function(f){
    var q=f.p.map(pr), n=cross(sub(f.p[1],f.p[0]),sub(f.p[3],f.p[0])), nl=Math.sqrt(dot(n,n));
    if(dot(n,view.depth)/nl<=1e-3) return;                  // 外向きの法線が 見る人の方を向いていない面は 描かない
    var lit=0.72+0.28*Math.max(0,dot(n,[0.3,0.5,0.8])/nl/1.0);
    var depth=f.p.reduce(function(s,p){ return s+dot(p,view.depth||[0,0,0]); },0)/f.p.length;
    vis.push({f:f,q:q,lit:lit,depth:depth});
  });
  vis.sort(function(a,b){ return a.depth-b.depth; });
  var all=[].concat.apply([],vis.map(function(x){return x.q;}));
  if(o.extra) all=all.concat(o.extra);
  var x0=Math.min.apply(null,all.map(function(p){return p[0];})), x1=Math.max.apply(null,all.map(function(p){return p[0];}));
  var y0=Math.min.apply(null,all.map(function(p){return p[1];})), y1=Math.max.apply(null,all.map(function(p){return p[1];}));
  var m=Math.max(x1-x0,y1-y0)*0.12, vb=[x0-m,y0-m,x1-x0+2*m,y1-y0+2*m];
  var s=o.under||"";
  vis.forEach(function(x){
    var f=x.f, col=shade(f.col,x.lit), d=rpath(x.q,30,f.sharp);   // 30mm 相当まで 角を丸める
    s+='<path d="'+d+'" fill="'+col+'" stroke="#5A3A1E" stroke-width="'+(vb[2]/260).toFixed(2)+'" stroke-linejoin="round"/>';
    if(f.slit&&!f.top){                                     // 段の下の すき間（写真の黒い筋）
      var a=x.q[0],b=x.q[1],c=x.q[2],e=x.q[3], t=14/f.h;   // すき間は どの段も同じ 14mm（段の高さに比例させると 1段目だけ太くなる）
      var p1=[a[0]+(e[0]-a[0])*t,a[1]+(e[1]-a[1])*t], p2=[b[0]+(c[0]-b[0])*t,b[1]+(c[1]-b[1])*t];
      var w=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(w>vb[2]*0.04) s+='<path d="M'+[a,b,p2,p1].map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1);}).join("L")+'Z" fill="'+SLIT+'" opacity=".55"/>';
    }
    if(f.num!==null&&f.num!==undefined){                    // 助走側の面に 段の番号（面に沿って ゆがめる）
      var A=x.q[0],B=x.q[1],C=x.q[2],D=x.q[3], cx=(A[0]+B[0]+C[0]+D[0])/4, cy=(A[1]+B[1]+C[1]+D[1])/4;
      var ux=[(A[0]-B[0]+D[0]-C[0])/2,(A[1]-B[1]+D[1]-C[1])/2], uy=[(D[0]-A[0]+C[0]-B[0])/2,(D[1]-A[1]+C[1]-B[1])/2];
      var wl=Math.hypot(ux[0],ux[1]), hl=Math.hypot(uy[0],uy[1]);
      if(wl>vb[2]*0.05&&hl>vb[3]*0.02){ var sc=Math.min(hl*0.8,wl*0.3)/1;
        s+='<text transform="matrix('+(ux[0]/wl*sc/10).toFixed(3)+' '+(ux[1]/wl*sc/10).toFixed(3)+' '+(-uy[0]/hl*sc/10).toFixed(3)+' '+(-uy[1]/hl*sc/10).toFixed(3)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')" font-size="10" font-weight="900" fill="#fff" text-anchor="middle" dominant-baseline="central" style="paint-order:stroke;stroke:#5A3A1E;stroke-width:.8">'+f.num+'</text>'; }
    }
  });
  return {svg:s+(o.over||""), vb:vb};
}

/* ===== 図を並べる ===== */
var VIEWS=[
  {t:"地図用（縦向き）", d:"床の形は真上のまま、高さだけ上へ。助走は画面の下から", make:function(){ var v=plan(0.5,false); v.depth=[0,0.5,1]; return v; }, map:true},
  {t:"地図用（横向き）", d:"同じ描き方。長い辺を左右に置く（助走は右から）", make:function(){ var v=plan(0.5,true); v.depth=[-0.5,0,1]; return v; }, map:true},
  {t:"正面（助走してくる方向から）", d:"児童が見る景色。上面が少し見える", make:function(){ var v=ortho(0,14); v.depth=v.v; return v; }},
  {t:"横", d:"真横。高さと長さを正しく測れる", make:function(){ var v=ortho(90,0); v.depth=v.v; return v; }},
  {t:"斜め上", d:"何の物かをひと目でつかむための図", make:function(){ var v=ortho(35,28); v.depth=v.v; return v; }}
];
function build(dan){
  var mesh=boxMesh(dan), h="";
  VIEWS.forEach(function(V){
    var view=V.make(), o={};
    if(V.map){                                              // 床の方眼（0.5m）と 床に接する形（点線）
      var f=mesh.foot, rot=view.rot, hw=(rot?f.L:f.W)/2, hl=(rot?f.W:f.L)/2, g="", R=1100;
      for(var x=-R;x<=R;x+=500) g+='<line class="grid-l" x1="'+x+'" x2="'+x+'" y1="'+(-R)+'" y2="'+R+'"/>';
      for(var y=-R;y<=R;y+=500) g+='<line class="grid-l" y1="'+y+'" y2="'+y+'" x1="'+(-R)+'" x2="'+R+'"/>';
      o.under='<rect class="floor" x="'+(-R)+'" y="'+(-R)+'" width="'+2*R+'" height="'+2*R+'"/>'+g;
      o.over='<rect class="foot" x="'+(-hw)+'" y="'+(-hl)+'" width="'+2*hw+'" height="'+2*hl+'"/>';
      o.extra=[[-R*0.75,-R*0.75],[R*0.75,R*0.75]];
    }
    var r=draw(mesh,view,o), vb8=draw(boxMesh(8),view,o).vb;   // 縮尺は 8段のときに固定（段数で高さを比べられるように）
    r.vb=vb8;
    h+='<figure><figcaption>'+V.t+'<small>'+V.d+'</small></figcaption><svg viewBox="'+r.vb.map(function(n){return n.toFixed(1);}).join(" ")+'">'+r.svg+'</svg></figure>';
  });
  document.getElementById("views").innerHTML=h;
}
var dan=document.getElementById("dan");
dan.oninput=function(){ document.getElementById("danV").textContent=dan.value; build(+dan.value); };
build(8);
})();
</script>
</body>
</html>
