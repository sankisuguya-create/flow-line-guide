<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>間取り合わせ</title>
<!-- 写真・敷地図の上に space.json を重ね、点と区画をドラッグで合わせる道具（教師用・学期に数回）。
     写真はこの端末の中だけで使い、どこにも送らない。結果は space.json として書き出す。 -->
<style>
  :root{--ink:#143242;--soft:#4B6C80;--line:#C7DAE7;--me:#0B5CAD;--warn:#B3261E;--bg:#F7FAFC}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Hiragino Sans","Yu Gothic UI","BIZ UDPGothic","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:flex;height:100%}
  .side{width:280px;flex:0 0 280px;overflow-y:auto;padding:12px;border-right:2px solid var(--ink);background:#fff}
  h1{font-size:16px;margin:0 0 10px}
  .grp{margin-bottom:14px}
  .lab{display:block;font-size:12px;font-weight:800;color:var(--soft);margin-bottom:4px}
  button,label.btn{font:inherit;font-weight:700;display:block;width:100%;text-align:left;padding:8px 10px;margin:0 0 6px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
  button[aria-pressed=true]{background:#FBD9AE}
  input[type=file]{display:none}
  input[type=range]{width:100%}
  .hint{font-size:13px;color:var(--soft);min-height:2.6em}
  .stage{flex:1;position:relative;overflow:hidden;background:#dfe6ec;touch-action:none}
  svg{width:100%;height:100%;display:block}
  .pt circle{fill:var(--me);stroke:#fff;stroke-width:2;cursor:grab}
  .pt text{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3}
  .area rect{fill:rgba(255,255,255,.18);stroke:var(--ink);stroke-width:1.5}
  .area text{font-size:13px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3}
  .hd{fill:#fff;stroke:var(--ink);stroke-width:1.5;cursor:nwse-resize}
  .edge{stroke:var(--me);stroke-width:2;opacity:.7}
  .edge.one{stroke-dasharray:6 4}
  .cal{stroke:var(--warn);stroke-width:3}
  .status{font-weight:800}
  .status.kari{color:var(--warn)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>間取り合わせ</h1>
    <div class="grp">
      <span class="lab">1. よみこむ</span>
      <label class="btn">写真・地図をえらぶ<input type="file" id="fPhoto" accept="image/*"></label>
      <label class="btn">space.json をえらぶ<input type="file" id="fSpace" accept=".json,application/json"></label>
    </div>
    <div class="grp">
      <span class="lab">2. 写真の大きさを合わせる</span>
      <button id="mCal">長さが分かる2点を押す</button>
      <span class="lab">写真の回転</span><input type="range" id="rot" min="-45" max="45" step="0.5" value="0">
      <span class="lab">写真のこさ</span><input type="range" id="op" min="0" max="1" step="0.05" value="0.6">
    </div>
    <div class="grp">
      <span class="lab">3. 直す</span>
      <button id="mMove" aria-pressed="true">点・区画を動かす</button>
      <button id="mPhoto">写真を動かす</button>
      <button id="mAdd">点を足す</button>
      <button id="mLink">通路をつなぐ（2点を押す）</button>
      <button id="mDel">点・通路を消す</button>
    </div>
    <div class="grp">
      <span class="lab">4. たしかめて 書き出す</span>
      <div class="status" id="st"></div>
      <button id="ok">向き・出入口を たしかめた（確認済にする）</button>
      <button id="save">space.json を書き出す</button>
    </div>
    <div class="hint" id="hint">写真と space.json をえらんでください。</div>
  </aside>
  <main class="stage" id="stage"><svg id="svg"></svg></main>
</div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var svg=$("svg"), PX=20;                     // 1m = 20px（図の単位）
var space=null, photo={src:"",x:0,y:0,s:1,rot:0,w:0,h:0}, mode="move", pend=[], view={x:-20,y:-20,z:1};
function hint(t){ $("hint").textContent=t; }

function draw(){
  if(!space){ svg.innerHTML=""; return; }
  var W=space.size[0]*PX, H=space.size[1]*PX, s="";
  svg.setAttribute("viewBox",[view.x,view.y,(W+40)/view.z,(H+40)/view.z].join(" "));
  if(photo.src) s+='<g transform="translate('+photo.x+' '+photo.y+') rotate('+photo.rot+') scale('+photo.s+')" opacity="'+$("op").value+'"><image href="'+photo.src+'" width="'+photo.w+'" height="'+photo.h+'"/></g>';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="none" stroke="#8E9AA3" stroke-dasharray="4 4"/>';
  space.areas.forEach(function(a,i){ var r=a.rect.map(function(v){return v*PX;});
    s+='<g class="area"><rect data-a="'+i+'" x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'"/><text x="'+(r[0]+4)+'" y="'+(r[1]+15)+'">'+a.label+'</text>'+
       '<rect class="hd" data-h="'+i+'" x="'+(r[0]+r[2]-6)+'" y="'+(r[1]+r[3]-6)+'" width="12" height="12"/></g>'; });
  space.paths.forEach(function(e,i){ var a=space.points[e[0]], b=space.points[e[1]]; if(!a||!b) return;
    s+='<line class="edge'+(e[2]&&e[2].oneway?" one":"")+'" data-e="'+i+'" x1="'+a[0]*PX+'" y1="'+a[1]*PX+'" x2="'+b[0]*PX+'" y2="'+b[1]*PX+'"/>'; });
  Object.keys(space.points).forEach(function(k){ var p=space.points[k];
    s+='<g class="pt"><circle data-p="'+k+'" cx="'+p[0]*PX+'" cy="'+p[1]*PX+'" r="'+(pend.indexOf(k)>=0?9:6)+'"/><text x="'+(p[0]*PX+8)+'" y="'+(p[1]*PX-6)+'">'+k+'</text></g>'; });
  if(mode==="cal"&&pend.length===1&&pend[0].pt) s+='<circle class="cal" cx="'+pend[0].pt[0]+'" cy="'+pend[0].pt[1]+'" r="6" fill="none"/>';
  svg.innerHTML=s;
  $("st").textContent="地図の状態："+space.status; $("st").className="status"+(space.status==="確認済"?"":" kari");
}
function toSvg(e){ var p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
var r1=function(v){return Math.round(v*10)/10;};

$("fPhoto").onchange=function(){ var f=this.files[0]; if(!f) return; var rd=new FileReader();
  rd.onload=function(){ var im=new Image(); im.onload=function(){ photo.src=rd.result; photo.w=im.width; photo.h=im.height;
    if(space){ photo.s=Math.min(space.size[0]*PX/im.width, space.size[1]*PX/im.height); } draw();
    hint("「長さが分かる2点を押す」で写真の縮尺を合わせます（例：プールの端から端＝25m）。"); }; im.src=rd.result; }; rd.readAsDataURL(f); };
$("fSpace").onchange=function(){ var f=this.files[0]; if(!f) return; f.text().then(function(t){
  try{ space=JSON.parse(t); }catch(err){ hint("JSONとして読めません："+err.message); return; }
  space.paths=space.paths||[]; space.points=space.points||{}; space.areas=space.areas||[]; draw(); hint("点（青）と区画（四角）を写真に合わせてドラッグします。"); }); };
function setMode(m){ mode=m; pend=[]; ["mMove","mPhoto","mAdd","mLink","mDel","mCal"].forEach(function(id){ $(id).setAttribute("aria-pressed", id==="m"+m[0].toUpperCase()+m.slice(1)); }); draw();
  hint({move:"点・区画の角（白い□）をドラッグします。",photo:"写真をドラッグして位置を合わせます。",add:"足したい所を押して、名前を入れます（例：line.5）。",
        link:"つなぐ2点を順に押します。1点目→2点目の向きの一方通行にするかを聞きます。",del:"消したい点か通路を押します。",cal:"写真の上で、長さが分かる2点を順に押します。"}[m]); }
$("mMove").onclick=function(){setMode("move");}; $("mPhoto").onclick=function(){setMode("photo");}; $("mAdd").onclick=function(){setMode("add");};
$("mLink").onclick=function(){setMode("link");}; $("mDel").onclick=function(){setMode("del");}; $("mCal").onclick=function(){setMode("cal");};
$("rot").oninput=function(){ photo.rot=+this.value; draw(); }; $("op").oninput=draw;

var drag=null;
svg.addEventListener("pointerdown",function(e){
  if(!space) return; var q=toSvg(e), t=e.target, d=t.dataset;
  if(mode==="cal"){ pend.push({pt:[q.x,q.y]}); if(pend.length===2){ var m=parseFloat(prompt("2点の間は何メートル？","25")); if(m>0){
      var a=pend[0].pt, b=pend[1].pt, cur=Math.hypot(b[0]-a[0],b[1]-a[1]), k=m*PX/cur;
      photo.x=a[0]+(photo.x-a[0])*k; photo.y=a[1]+(photo.y-a[1])*k; photo.s*=k; hint("写真の縮尺を合わせました。次は「写真を動かす」で位置を合わせます。"); }
      setMode("photo"); } draw(); return; }
  if(mode==="add"){ var n=prompt("点の名前（例：line.5、exit）"); if(n){ space.points[n]=[r1(q.x/PX),r1(q.y/PX)]; } draw(); return; }
  if(mode==="del"){ if(d.p){ delete space.points[d.p]; space.paths=space.paths.filter(function(x){return x[0]!==d.p&&x[1]!==d.p;}); }
    if(d.e) space.paths.splice(+d.e,1); draw(); return; }
  if(mode==="link"){ if(!d.p) return; pend.push(d.p); if(pend.length===2){ if(pend[0]!==pend[1]){
      var one=confirm(pend[0]+" → "+pend[1]+" の一方通行にしますか？（キャンセル＝両方向）");
      space.paths.push(one?[pend[0],pend[1],{oneway:true}]:[pend[0],pend[1]]); } pend=[]; } draw(); return; }
  if(mode==="photo"){ drag={kind:"photo",q:q,x:photo.x,y:photo.y}; }
  else if(d.p) drag={kind:"pt",k:d.p};
  else if(d.h) drag={kind:"hd",i:+d.h};
  else if(d.a) drag={kind:"area",i:+d.a,q:q,r:space.areas[+d.a].rect.slice()};
  if(drag) svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove",function(e){ if(!drag) return; var q=toSvg(e);
  if(drag.kind==="photo"){ photo.x=drag.x+q.x-drag.q.x; photo.y=drag.y+q.y-drag.q.y; }
  if(drag.kind==="pt") space.points[drag.k]=[r1(q.x/PX),r1(q.y/PX)];
  if(drag.kind==="hd"){ var a=space.areas[drag.i].rect; a[2]=Math.max(0.5,r1(q.x/PX-a[0])); a[3]=Math.max(0.5,r1(q.y/PX-a[1])); }
  if(drag.kind==="area"){ var A=space.areas[drag.i].rect; A[0]=r1(drag.r[0]+(q.x-drag.q.x)/PX); A[1]=r1(drag.r[1]+(q.y-drag.q.y)/PX); }
  draw(); });
svg.addEventListener("pointerup",function(){ drag=null; });
$("stage").addEventListener("wheel",function(e){ e.preventDefault(); view.z=Math.max(0.5,Math.min(6,view.z*(e.deltaY<0?1.15:1/1.15))); draw(); },{passive:false});

$("ok").onclick=function(){ if(!space) return; space.status="確認済"; space.statusNote="間取り合わせで 向き・出入口を確認（"+new Date().toLocaleDateString("ja-JP")+"）"; draw(); };
$("save").onclick=function(){ if(!space) return;
  var blob=new Blob([JSON.stringify(space,null,2)+"\n"],{type:"application/json"}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="space.json"; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  hint("書き出しました。spaces/"+space.id+"/space.json を置きかえてください。"); };
})();
</script>
</body>
</html>
