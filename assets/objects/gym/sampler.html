<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体育館の用具の図（試作）</title>
<!-- 体育館の用具の図の試作。用具ごとに 1つの立体（実寸 mm）を持ち、見方だけを変えて描く。
     どの図も 同じ縮尺（1枚の幅＝3000mm）なので、用具どうしの大きさを そのまま比べられる。
     地図用は「床の形は真上のまま、高さだけ画面の上へ 0.5倍で立ち上げる」描き方。床の位置・向き・寸法は地図と一致する。
     座標：X＝幅、Y＝長さ（+Y が 助走してくる側）、Z＝高さ。 -->
<style>
  :root{--ink:#143242;--soft:#4B6C80;--bg:#F7FAFC;--line:#C7DAE7}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic UI","BIZ UDPGothic","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px;border-bottom:2px solid var(--ink);background:#fff;position:sticky;top:0;z-index:2}
  h1{font-size:18px;margin:0}
  label{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  h2{font-size:16px;margin:16px 16px 0}
  h2 small{font-weight:400;color:var(--soft);font-size:12px;margin-left:8px}
  .grid{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;padding:8px 16px}
  figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
  figcaption{font-weight:800;font-size:13px}
  figcaption small{display:block;font-weight:400;color:var(--soft);font-size:11px}
  svg{width:100%;height:auto;display:block}
  .floor{fill:#EEF3F7} .gl{stroke:#D6E2EA;stroke-width:6}
  .foot{fill:none;stroke:#0B5CAD;stroke-width:10;stroke-dasharray:40 30}
  .wide{grid-column:1/-1}
</style>
</head>
<body>
<header>
  <h1>体育館の用具の図（試作）</h1>
  <label>跳び箱の段数 <input type="range" id="dan" min="1" max="8" value="8"><span id="danV">8</span>段</label>
  <label>白マット <select id="matSize"><option value="L">9号 120×240×6cm</option><option value="S">6号 90×180×5cm</option></select></label>
  <label>厚いマット <select id="thick"><option value="400">200×300×40cm</option><option value="500">200×300×50cm</option></select></label>
  <label><input type="checkbox" id="handles" checked> 取っ手を見せる</label>
</header>
<div id="out"></div>
<script src="mesh.js"></script>
<script>
(function(){
"use strict";
/* ===== 用具（寸法の正本。ここだけ直せば 全部の図が変わる） ===== */
/* 立体と描き方の正本は mesh.js（配置図 apps/haichi と共用）。ここは見方を並べるだけ */
var SPEC=GYM.SPEC, tobibako=GYM.tobibako, mat=GYM.mat, thickMat=GYM.thickMat, cone=GYM.cone, board=GYM.board,
    ortho=GYM.ortho, plan=GYM.plan, drawFaces=GYM.drawFaces;
var VIEWS=[
  {t:"地図用（縦向き）", d:"助走は画面の下から", make:function(){return plan(0.5,false);}},
  {t:"地図用（横向き）", d:"助走は右から", make:function(){return plan(0.5,true);}},
  {t:"正面", d:"助走してくる方向から", make:function(){return ortho(0,14);}},
  {t:"横", d:"真横（高さ・長さを測れる）", make:function(){return ortho(90,0);}},
  {t:"斜め上", d:"何の物かをつかむ", make:function(){return ortho(35,28);}}
];

function figure(title,desc,objs,view,o){
  o=o||{}; var r=drawFaces(objs,view), under="";
  var xs=r.pts.map(function(p){return p[0];}), ys=r.pts.map(function(p){return p[1];});
  var cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2, cy=(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;
  var W=o.W||3000, H=o.H||2700, vb=[cx-W/2,cy-H/2,W,H];
  if(view.map){                                         // 床の方眼（500mm）と 床に接する形（点線）
    var g="", x0=Math.floor(vb[0]/500)*500, y0=Math.floor(vb[1]/500)*500;
    for(var x=x0;x<=vb[0]+W;x+=500) g+='<line class="gl" x1="'+x+'" x2="'+x+'" y1="'+vb[1]+'" y2="'+(vb[1]+H)+'"/>';
    for(var y=y0;y<=vb[1]+H;y+=500) g+='<line class="gl" y1="'+y+'" y2="'+y+'" x1="'+vb[0]+'" x2="'+(vb[0]+W)+'"/>';
    under='<rect class="floor" x="'+vb[0]+'" y="'+vb[1]+'" width="'+W+'" height="'+H+'"/>'+g;
    objs.forEach(function(ob){ var f=ob.foot, hw=(view.rot?f.L:f.W)/2, hl=(view.rot?f.W:f.L)/2, c=view.P(ob.off);
      under+='<rect class="foot" x="'+(c[0]-hw)+'" y="'+(c[1]-hl)+'" width="'+2*hw+'" height="'+2*hl+'"/>'; });
  }
  return '<figure class="'+(o.cls||"")+'"><figcaption>'+title+'<small>'+desc+'</small></figcaption><svg viewBox="'+vb.join(" ")+'">'+under+r.svg+'</svg></figure>';
}
function build(dan){
  var ms=$("matSize").value, hd=$("handles").checked, tk=+$("thick").value;
  var items=[{k:"tobibako",m:tobibako(dan)},{k:"board",m:board()},{k:"mat",m:mat(ms,hd),note:SPEC.mat.sizes[ms].note},
             {k:"thick",m:thickMat(tk,hd),big:true},{k:"cone",m:cone()},{k:"pipechair",m:GYM.pipeChair()},{k:"longtable",m:GYM.longTable()}], h="";
  items.forEach(function(it){ var S=SPEC[it.k];
    h+='<h2>'+S.name+'<small>'+(it.note||S.note)+(it.k==="mat"||it.k==="thick"?(hd?"。取っ手あり":"。取っ手なし（床とのすき間に入れ込んだ状態）"):"")+'</small></h2><div class="grid">';
    VIEWS.forEach(function(V){ h+=figure(V.t,V.d,[{faces:it.m.faces,foot:it.m.foot,off:[0,0,0]}],V.make(),it.big?{W:4000,H:3600}:null); });
    h+='</div>';
  });
  // 並べた例：助走 → ロイター板 → 跳び箱 → マット（すき間は仮）
  var tb=items[0].m, bd=items[1].m, mt=items[2].m, gap=400;
  var yB=tb.foot.L/2+gap+SPEC.board.L/2, yM=-(tb.foot.L/2+mt.foot.L/2);
  var scene=[{faces:mt.faces,foot:mt.foot,off:[0,yM,0]},{faces:tb.faces,foot:tb.foot,off:[0,0,0]},{faces:bd.faces,foot:bd.foot,off:[0,yB,0]}];
  h+='<h2>並べた例<small>助走 → ロイター板 → 跳び箱 → マット。ロイター板と跳び箱のすき間400mmは仮</small></h2><div class="grid">';
  h+=figure("地図用（縦向き）","同じ縮尺",scene,plan(0.5,false),{W:3000,H:5600});
  h+=figure("斜め上","同じ縮尺",scene,ortho(35,28),{W:5200,H:3000});
  h+=figure("横","真横",scene,ortho(90,0),{W:5600,H:1400});
  h+='</div>';
  document.getElementById("out").innerHTML=h;
}
function $(id){ return document.getElementById(id); }
var dan=$("dan");
function rebuild(){ $("danV").textContent=dan.value; build(+dan.value); }
dan.oninput=rebuild; $("matSize").onchange=rebuild; $("thick").onchange=rebuild; $("handles").onchange=rebuild;
rebuild();
})();
</script>
</body>
</html>
